<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="logo.png">
<title>MER-K · Compra y vende de todo en Colombia</title>
<meta name="description" content="MER-K es el marketplace colombiano donde compras y vendes de todo con tu dinero protegido. Domicilios en Medellín y alrededores y envíos a todo el país.">
<link rel="canonical" href="https://merkshopping.com/">
<meta property="og:type" content="website"><meta property="og:site_name" content="MER-K">
<meta property="og:title" content="MER-K · Compra, vende y recibe"><meta property="og:description" content="Compra y vende de todo en Colombia con tu dinero protegido.">
<meta property="og:url" content="https://merkshopping.com/"><meta property="og:image" content="https://merkshopping.com/logo-completo.png">
<meta name="theme-color" content="#4B63B6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#4B63B6; --blue-d:#3B4F96; --blue-soft:#E8ECF8;
  --pear:#CBD83B; --pear-d:#7C8A14; --pear-soft:#F3F6D6;
  --lav:#A88AED; --lav-soft:#EFE8FD;
  --ivory:#FFFEEC; --card:#FFFFFF;
  --ink:#232234; --ink2:#615C78; --line:#E9E3F5;
  --bad:#D64545; --bad-soft:#FDE7E7; --warn:#B7791F; --warn-soft:#FFF4DA;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.45;
  background:repeating-linear-gradient(90deg,#F7F2FF 0 46px,var(--ivory) 46px 92px);min-height:100vh}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
.f{font-family:'Fredoka',sans-serif}
/* header */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap}
.logo{font-family:'Fredoka',sans-serif;font-weight:700;font-size:30px;color:var(--blue);text-decoration:none;display:flex;align-items:center;gap:8px;letter-spacing:.5px}
.logo span{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--pear);color:var(--blue);font-size:20px}
.loc{border:0;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;white-space:nowrap}
.search{flex:1;min-width:200px;display:flex;background:#fff;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.search:focus-within{border-color:var(--lav)}
.search input{flex:1;border:0;background:transparent;padding:10px 16px;outline:none}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{text-decoration:none;padding:8px 13px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink2)}
nav a:hover{color:var(--blue)}
nav a.on{background:var(--pear);color:var(--ink)}
main{max-width:1200px;margin:0 auto;padding:22px 20px 80px}
/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:26px;align-items:center;margin:6px 0 26px}
.hero h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:46px;line-height:1.05;margin:0 0 12px;color:var(--blue)}
.hero p{margin:0;color:var(--ink2);font-weight:600;font-size:16px}
.shield{display:grid;gap:10px}
.shield div{background:linear-gradient(180deg,#fff,#FBFAFF);border-radius:14px;padding:13px 15px;font-size:14px;
  box-shadow:0 1px 0 #fff inset,0 8px 18px rgba(75,99,182,.12),0 2px 4px rgba(75,99,182,.08)}
.shield b{color:var(--blue)}
/* chips & cards */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px;color:var(--ink2)}
.chip:hover{border-color:var(--lav);color:var(--blue)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:8px 0 12px}
.sec h3{font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;margin:0;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:232px;gap:16px;overflow-x:auto;padding-bottom:6px;margin-bottom:26px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;
  box-shadow:0 6px 16px rgba(60,50,120,.07),0 1px 2px rgba(60,50,120,.05);transition:transform .15s,box-shadow .15s;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 30px rgba(60,50,120,.13)}
.thumb{aspect-ratio:4/3;display:grid;place-items:center;font-size:58px;background-size:cover;background-position:center}
.cbody{padding:12px 14px 14px}
.old{font-size:12.5px;color:var(--ink2);text-decoration:line-through}
.price{font-family:'Fredoka',sans-serif;font-weight:600;font-size:21px}
.off{color:var(--pear-d);font-weight:800;font-size:13px;margin-left:6px}
.ptitle{font-size:14px;color:var(--ink2);margin:2px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.shipline{font-size:12.5px;font-weight:800;color:var(--pear-d)}
.shipline.muted{color:var(--ink2);font-weight:600}
.meta{font-size:12.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:6px;margin-top:6px}
.disc-tag{position:absolute;top:10px;left:10px;background:var(--pear);color:var(--ink);font-weight:800;font-size:12px;padding:3px 9px;border-radius:999px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--pear-soft);color:var(--pear-d);white-space:nowrap}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.lav{background:var(--lav-soft);color:#6D4FCF}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.dark{background:var(--blue);color:#fff}
h2{font-family:'Fredoka',sans-serif;font-weight:600;font-size:32px;margin:0 0 4px;color:var(--blue)}
.sub{color:var(--ink2);margin:0 0 18px}
/* buttons */
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;background:var(--blue);color:#fff;
  box-shadow:0 4px 0 var(--blue-d),0 8px 16px rgba(75,99,182,.18);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.pear{background:var(--pear);color:var(--ink);box-shadow:0 4px 0 #A9B42A}
.btn.lav{background:var(--lav);box-shadow:0 4px 0 #8C6CD8}
.btn.bad{background:#fff;color:var(--bad);border:1.5px solid #F2C4C4;box-shadow:0 3px 0 #F2C4C4}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
/* panels */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px;box-shadow:0 4px 14px rgba(60,50,120,.05)}
.panel h3{margin:0 0 12px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:19px;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 4px 14px rgba(60,50,120,.05)}
.kpi small{color:var(--ink2);font-weight:700;font-size:12.5px}
.kpi div{font-family:'Fredoka',sans-serif;font-weight:600;font-size:26px;color:var(--blue);margin-top:2px}
.kpi .note{display:block;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--ink2);font-weight:700;font-size:12.5px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.empty{color:var(--ink2);font-size:14px;padding:6px 0}
.note{font-size:13px;color:var(--ink2)}
.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font-weight:700;font-size:13.5px}
.form input,.form textarea,.form select{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none;font-weight:500}
.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--lav)}
.check{display:flex!important;grid-template-columns:none;align-items:center;gap:8px;font-weight:600!important}
.check input{width:18px;height:18px;accent-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
fieldset{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:0;display:grid;gap:8px}
legend{font-weight:800;font-size:13.5px;padding:0 6px;color:var(--blue)}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--ink2)}
.tab:hover{border-color:var(--lav);color:var(--blue)}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--pear);color:var(--ink);font-size:11.5px;text-align:center}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--lav-soft);border-radius:14px;padding:10px 14px;margin-bottom:16px}
.who select{border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;font-weight:700}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.plan{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 16px rgba(60,50,120,.06)}
.plan.hot{border:2px solid var(--lav);background:#FBF8FF}
.plan h3{margin:0;font-family:'Fredoka',sans-serif;font-weight:600;font-size:26px;color:var(--blue)}
.plan .big{font-family:'Fredoka',sans-serif;font-size:28px;font-weight:600}
.plan ul{margin:0;padding-left:18px;color:var(--ink2);font-size:14px;display:grid;gap:5px;flex:1}
/* steps */
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.step{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:#F3F1F8;color:var(--ink2)}
.step.done{background:var(--pear-soft);color:var(--pear-d)}
.step.now{background:var(--blue);color:#fff}
.guia{display:inline-flex;gap:6px;align-items:center;background:var(--blue-soft);color:var(--blue);font-weight:800;border-radius:9px;padding:4px 10px;font-size:13px;margin-top:6px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(35,34,52,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.scrim.open{display:flex}
.modal{background:#fff;border-radius:22px;width:min(900px,100%);max-height:92vh;overflow-y:auto;overflow-x:hidden;position:relative}
.modal.narrow{width:min(560px,100%)}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:#F3F1F8;font-size:18px;z-index:2}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}
.detail .dinfo{min-width:0;overflow-wrap:anywhere}
.gallery{padding:22px 0 22px 22px;display:grid;gap:10px;position:sticky;top:0;min-width:0}
.gmain{position:relative;width:100%;aspect-ratio:1;max-height:min(400px,56vh);border-radius:16px;background-color:#F6F5FA;background-size:contain;background-repeat:no-repeat;background-position:center;display:grid;place-items:center;font-size:96px;margin:0 auto}
.garr{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:22px;line-height:1;cursor:pointer}
.garr.l{left:8px}.garr.r{right:8px}
.gcount{position:absolute;bottom:8px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.gthumbs{display:flex;gap:8px;flex-wrap:wrap}
.gth{width:58px;height:58px;border-radius:10px;border:2px solid transparent;background-color:#F6F5FA;background-size:cover;background-position:center;cursor:pointer;padding:0}
.gth.on{border-color:var(--blue)}
.pfotos{display:flex;gap:10px;flex-wrap:wrap}
.pphoto{position:relative;width:92px;height:92px;border-radius:12px;background-size:cover;background-position:center;background-color:#F6F5FA;border:1px solid #E6E3EF}
.pphoto .pdel,.pphoto .pmv{position:absolute;top:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1;cursor:pointer;padding:0}
.pphoto .pdel{right:4px}.pphoto .pmv{left:4px;font-size:12px}
.pcover{position:absolute;left:4px;bottom:4px;background:var(--blue);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:99px}
.padd{width:92px;height:92px;border-radius:12px;border:2px dashed #C9C4DA;display:grid;place-items:center;align-content:center;cursor:pointer;font-size:28px;font-weight:700;color:#7A7490;gap:0;margin:0}
.padd span{font-size:11px}
.padd input{display:none}
.dinfo{padding:28px 26px;display:flex;flex-direction:column;gap:11px}
.dinfo h3{margin:0;font-family:'Fredoka',sans-serif;font-weight:600;font-size:23px;line-height:1.2}
.seller{border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.protect{background:var(--pear-soft);color:#4F5A0C;border-radius:12px;padding:11px 13px;font-size:13.5px}
.shipbox{border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13.5px;display:grid;gap:4px}
.mpad{padding:26px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer}
.opt:has(input:checked){border-color:var(--blue);background:#F6F8FE}
.opt input{margin-top:3px;accent-color:var(--blue)}
.sum td{padding:6px 0;border:0}
/* chat */
.chat{display:flex;flex-direction:column;height:min(660px,88vh)}
.chead{padding:18px 22px;border-bottom:1px solid var(--line)}
.chead h3{margin:0 0 4px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px}
.msgs{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:8px;background:#FBFAF4}
.msg{max-width:78%;padding:9px 13px;border-radius:14px;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
.msg.b{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.s{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.hid{opacity:.6;font-style:italic}
.msg small{display:block;font-size:11px;opacity:.7;margin-bottom:2px;font-style:normal}
.sys{align-self:center;background:var(--bad-soft);color:var(--bad);font-size:13px;font-weight:700;padding:8px 12px;border-radius:10px;text-align:center;max-width:92%}
.sys.info{background:var(--lav-soft);color:#5A3FB8}
.cinput{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--line)}
.cinput input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:11px 16px;outline:none}
.tests{padding:0 22px 12px;display:flex;gap:6px;flex-wrap:wrap;background:#FBFAF4}
.tests button{border:1px dashed #CFC8E3;background:#fff;border-radius:999px;font-size:12px;padding:5px 10px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--blue);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:80;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.alert{font-size:12.5px;background:var(--bad-soft);color:var(--bad);padding:2px 8px;border-radius:6px;font-weight:700}
.addr{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:780px){
  .hero{grid-template-columns:1fr}
  .hero h1{font-size:34px}
  .detail{grid-template-columns:1fr}
  .gallery{padding:16px 16px 0;position:static}
  .gmain{max-height:46vh}
  .split,.row2,.row3{grid-template-columns:1fr}
}

.acct{display:flex;align-items:center;gap:8px}
.bell{position:relative;border:0;background:var(--lav-soft);width:38px;height:38px;border-radius:12px;font-size:17px}
.bell span{position:absolute;top:-5px;right:-5px;background:var(--pear);color:var(--ink);font-size:11px;font-weight:800;border-radius:999px;min-width:18px;padding:1px 5px}
.hello{font-size:13.5px;color:var(--ink2);white-space:nowrap}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rolecard{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:20px 16px;display:grid;gap:6px;text-align:center;box-shadow:0 4px 0 var(--line)}
.rolecard:hover{border-color:var(--lav)}
.rolecard span{font-size:40px}.rolecard b{font-family:'Fredoka',sans-serif;font-size:19px;color:var(--blue)}.rolecard small{color:var(--ink2)}
.notif{border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;display:grid;gap:3px;font-size:14px}
.notif.new{border-color:var(--lav);background:#FBF8FF}
.comanda{white-space:pre-wrap;font-size:13px;background:#FBFAF4;border:1.5px dashed #D9D3E8;border-radius:12px;padding:12px 14px;margin:10px 0;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.5}
.tl{display:grid;gap:8px;margin-top:8px;border-left:3px solid var(--lav-soft);padding-left:12px}
details summary{cursor:pointer}
@media (max-width:780px){.roles{grid-template-columns:1fr}.hello{display:none}}
.profit{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;margin-bottom:18px}
.profit>div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 4px 14px rgba(60,50,120,.05)}
.profit>div:first-child{background:linear-gradient(135deg,#F3F6D6,#FFFEEC);border:2px solid var(--pear)}
.profit small{font-weight:800;color:var(--ink2);font-size:13px}
.profit .big{font-family:'Fredoka',sans-serif;font-weight:700;font-size:38px;color:var(--blue);line-height:1.1;margin:4px 0}
.profit .mid{font-family:'Fredoka',sans-serif;font-weight:600;font-size:26px;color:var(--blue);margin:4px 0}
@media (max-width:780px){.profit{grid-template-columns:1fr}}
.sellplans{margin:46px 0 10px;padding:30px 0;border-top:2px dashed var(--line)}
.form label.opt{display:flex}
.plan ul{align-content:start}
.logo img{height:46px;width:auto;display:block}
.foot{max-width:1200px;margin:0 auto;padding:30px 20px 50px;text-align:center;border-top:1px solid var(--line)}
.foot img{height:110px;width:auto}
@media (max-width:780px){.logo img{height:38px}}
.procbox{margin:0}.procbox .split{align-items:start}
.todo{background:var(--lav-soft);color:#3F2E85;border-radius:12px;padding:10px 13px;font-size:13.5px;margin:10px 0}
.route{background:#FBFAF4;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
/* ===== funciones por plan ===== */
.lock{text-align:center;padding:30px 20px}
.lockic{font-size:34px;margin-bottom:4px}
.upsell{background:var(--lav-soft);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;color:#5B3FC0}
.upsell a{color:var(--blue);font-weight:800;margin-left:4px}
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.feat{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}

const NUMW = {cero:0,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9};
const NUMRX = /cero|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve/g;
const deacc = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'');
function digitize(text){
  let s = deacc(String(text).toLowerCase());
  s = s.replace(/([0-9])️?⃣/g,'$1 ');
  s = s.replace(/[\u{1D7CE}-\u{1D7FF}]/gu, ch => String((ch.codePointAt(0)-0x1D7CE)%10));
  s = s.replace(/[a-z0-9]+/g, tok => {
    if(/^\d+$/.test(tok)) return tok;
    const del = tok.replace(/3/g,'e').replace(/1/g,'i').replace(/0/g,'o').replace(/4/g,'a').replace(/5/g,'s').replace(/7/g,'t');
    if(NUMW[tok] !== undefined) return String(NUMW[tok]);
    if(NUMW[del] !== undefined) return String(NUMW[del]);
    if(/\d/.test(tok)) return tok.replace(NUMRX, w => String(NUMW[w]));
    return tok;
  });
  return s;
}
const COMPACT_KEYS = ['whatsapp','whatsap','watsap','wasap','wassap','guasap','whatsaap','telegram','instagram','gmail','hotmail','outlook','yahoo','facebook','tiktok','arroba','puntocom'];
const RX_KEYS = [
  [/\b(wpp|wsp|wa|ws|wht|whats)\b/, 'Mención de WhatsApp'],
  [/\b(ig|insta|face|fb)\b/, 'Mención de redes sociales'],
  [/@\s*[a-z0-9_.]{2,}/, 'Usuario de redes o correo'],
  [/https?:|www\.|\.com\b|\.co\b|wa\.me|bit\.ly|linktr/, 'Link a otra página'],
  [/\b(llamame|llameme|escribeme|escribame|contactame|marcame|timbrame)\b/, 'Pedir contacto por fuera'],
  [/\bmi (numero|num|cel|celular|telefono|tel|correo|mail|whats|contacto)\b/, 'Compartir datos de contacto'],
  [/\b(te|le) (paso|doy|dejo|envio) mi\b/, 'Compartir datos de contacto'],
  [/\b(por fuera|por interno|al privado|al dm|por dm|en privado)\b/, 'Negociar por fuera de la página'],
  [/\b(consignacion|consigname|transfiereme|pagame directo|pago directo|nequi directo|daviplata)\b/, 'Pedir pago por fuera de la página']
];
function isPrice(s, a, b){ return /\$/.test(s.slice(Math.max(0,a-3), a)) || /^\s*(pesos|cop|mil\b|k\b)/.test(s.slice(b, b+8)); }
function check(text){
  const raw = deacc(String(text).toLowerCase());
  if(/[\u{1F4DE}\u{1F4F1}\u{260E}\u{1F4E7}\u{2709}]/u.test(text)) return {ok:false, reason:'Emoji de teléfono o correo'};
  const compact = raw.replace(/[^a-z]/g,'');
  for(const k of COMPACT_KEYS) if(compact.includes(k)) return {ok:false, reason:'Mención de WhatsApp, redes o correo'};
  for(const [rx, why] of RX_KEYS) if(rx.test(raw)) return {ok:false, reason:why};
  const d = digitize(text); const rx = /\d(?:[^a-z0-9]*\d){6,}/g; let m;
  while((m = rx.exec(d))){ if(!isPrice(d, m.index, m.index+m[0].length)) return {ok:false, reason:'Número de teléfono (en cifras, letras o símbolos)'}; }
  return {ok:true, digits:(d.match(/\d/g)||[]).join(''), letters:d.replace(/[^a-z]/g,'').length};
}

/* Decide automáticamente según la ubicación del comprador:
   - Medellín y alrededores (y vendedor en la zona): domicilio con la tarifa de la zona.
   - Resto del país: envío nacional con el costo que puso el vendedor en el producto.
   Si el producto tiene envío gratis, el comprador no paga envío y el costo lo asume el vendedor. MER-K nunca paga envíos. */
function shipping(p, city){
  const s = SEL(p.s), free = !!p.freeShip;
  if(inArea(city) && inArea(s.city)){
    const tarifa = zonePrice(city);
    return {type:'dom', tarifa, free, cost:free?0:tarifa, eta:'Entrega en '+etaDom(), label:'Domicilio en Medellín y alrededores'};
  }
  const nc = p.natCost||0;
  return {type:'nat', free, eta:'Entrega en '+etaNat()+' según la transportadora', label:'Envío nacional',
          options: CARRIERS.map(c=>({carrier:c, cost: free?0:nc}))};
}
function shipLine(p){
  const sh = shipping(p, S.loc);
  if(sh.type==='dom') return `<div class="shipline">${sh.free?'Domicilio gratis · ':''}${sh.eta}</div>`;
  const min = Math.min(...sh.options.map(o=>o.cost));
  return `<div class="shipline ${sh.free?'':'muted'}">${sh.free?'Envío gratis':'Envío nacional '+cop(min)}</div>`;
}

function doRegister(e, role){
  e.preventDefault();
  const err = t => { const el=$('#rErr'); el.textContent=t; el.style.display='block'; };
  const email=$('#rEmail').value.trim().toLowerCase(), phone=$('#rPhone').value.replace(/\s/g,''), pass=$('#rPass').value;
  if(!validEmail(email)) return err('Escribe un correo válido.');
  if(!validPhone(phone)) return err('El celular debe tener 10 dígitos y empezar por 3.');
  if(pass.length<8) return err('La contraseña debe tener mínimo 8 caracteres.');
  if(pass!==$('#rPass2').value) return err('Las contraseñas no coinciden.');
  if(S.users.some(u=>u.email===email)) return err('Ya existe una cuenta con ese correo.');
  const name=$('#rName').value.trim(), doc=$('#rDoc').value.trim(), dir=$('#rDir').value.trim(), city=readCity('rCity','rCityO'); if(!city) return err('Escribe tu municipio.');
  let key;
  if(role==='buyer'){
    key='b'+(S.nextBuyer++);
    S.buyers[key]={name, email, phone, doc, warnings:0, status:'activa', addresses:[{id:Date.now(), alias:'Principal', name, dir, city, notes:$('#rNotes').value.trim()}]};
  } else {
    const shop=$('#rShop').value.trim(); const r=check(shop); if(!r.ok) return err('El nombre de la tienda no puede tener datos de contacto ('+r.reason+').');
    const bnum=$('#rBNum').value.trim(); if(bnum!==$('#rBNum2').value.trim()) return err('Los números de cuenta no coinciden.');
    key='s'+(S.nextSeller++);
    S.sellers[key]={name:shop, type:$('#rType').value, plan:'gratis', city, rating:5.0, sales:0, warnings:0, status:'activa', available:0, paid:0, owner:name, email, phone, doc, addr:dir, bank:{banco:$('#rBank').value, tipo:$('#rBType').value, num:'•••• '+bnum.slice(-4), titular:$('#rBHolder').value.trim(), doc:$('#rBDoc').value.trim()}, ship:{domFree:false, natFree:false}};
    notify('admin','Nuevo vendedor', `${shop} (${city}) se registró.`);
  }
  S.users.push({email, pass:h(pass), role, key}); save();
  toast('¡Cuenta creada!'); startSession(S.users[S.users.length-1]);
}

function calcRows(v){
  v=Math.max(0,+v||0); const pp=procParts(v);
  return `<table class="sum">${['gratis','emprendedor','pro'].map(k=>{ const c=Math.round(v*S.cfg.fees[k]/100); return `<tr><td>Plan ${PLAN_INFO[k].name} <span class="note">(comisión ${cop(c)} + procesamiento ${cop(pp.total)})</span></td><td style="text-align:right"><b>${cop(v-c-pp.total)}</b></td></tr>`; }).join('')}</table>`;
}

function coState(id){
  const p=P(id), addr=BUY(me().key).addresses.find(a=>a.id===+$('#coAddr').value), sh=shipping(p, addr.city);
  let opt;
  if(sh.type==='dom') opt={carrier:null, cost:sh.cost};

  const cp = CO_CP ? findCoupon(CO_CP, p) : null;
  return {p, addr, sh, opt, cp: cp && !cp.err ? cp : null};
}
function coRefresh(id){
  const {p, addr, sh, opt, cp} = coState(id);
  $('#coShip').innerHTML = sh.type==='dom'

function createOrder(p, bk, addr, sh, opt, payMethod, cp){
  const b=BUY(bk), price=finalPrice(p)-(cp?cp.amount:0), sk=p.s;
  const o = {id:S.nextOrder++, pid:p.id, sk, bk, title:p.t, price, origin:SEL(sk).city,
    ship:{type:sh.type, mode:null, carrier:opt.carrier, cost:opt.cost, free:!!sh.free, tarifa: sh.type==='dom'?sh.tarifa:opt.cost},
    addr:{name:addr.name, dir:addr.dir, city:addr.city, notes:addr.notes, phone:b.phone}, pay:payMethod,
    status:'pagado', fee:feeOf(sk), fixed:fixedOf(sk, price), proc: sk===OFFICIAL?0:procParts(price+opt.cost).total, created:now(), ts:T(), coupon: cp?{code:cp.code, amount:cp.amount}:null, timeline:[{t:now(), s:'pagado', note:STATES.pagado.buyer}]};
  // Envío nacional: el vendedor paga la guía, así que se le reconoce lo que pagó el comprador por el envío.
  // Domicilio: se define cuando el vendedor elige domiciliario de MER-K o propio (ver chooseDelivery).
  o.sellerGross = price + opt.cost;
  if(cp) cp.c.used++;
  p.stock--; S.orders.unshift(o); logStock(p, -1, 'Venta · pedido #'+o.id); lowStockCheck(p);
  notify(bk, `✅ Tu pago fue confirmado · Pedido #${o.id}`, `Compraste "${p.t}" por ${cop(price+opt.cost)}. Tu dinero queda protegido en MER-K y te avisamos cada vez que tu pedido avance.`, {link:'o:'+o.id});
  notify('admin', `Nuevo pedido #${o.id} · confirma el pago`, `${p.t} · ${cop(price+opt.cost)} · ${SEL(sk).name} → ${addr.city} (${sh.type==='dom'?'domicilio':'envío por '+opt.carrier})`);
  return o;
}
function pay(id){
  const {p, addr, sh, opt, cp} = coState(id);
  if(p.stock<1){ toast('Este producto se agotó.'); return; }
  createOrder(p, me().key, addr, sh, opt, $('#coPay').value, cp); CO_CP=null;
  save(); toast('¡Pago recibido! Te avisamos cada cambio de tu pedido.'); S.ui.buyTab='compras'; closeModal(); location.hash='#compras';
}

function stepsHtml(o){
  if(o.status==='reclamo' || o.status==='devuelto') return `<div class="steps"><span class="step now">${STATES[o.status].label}</span></div>`;
  const F = flowOf(o), cur = o.liquidated ? F.length : F.indexOf(o.status);
  return '<div class="steps">'+F.map((k,i)=>`<span class="step ${i<cur||(i===cur&&k==='liberado')?'done':i===cur?'now':''}">${STATES[k].label.split(' · ')[0]}</span>`).join('')+'</div>';
}
function deliveryHtml(o){
  if(!o.delivery) return '';
  const d=o.delivery, when = d.date ? ` · ${fdate(Date.parse(d.date+'T12:00'))}${d.time?', '+esc(d.time):''}` : (d.eta?' · llega '+esc(d.eta):'');
  return d.kind==='guia' ? `<div class="guia">📦 ${esc(d.carrier)} · Guía ${esc(d.guia)}</div><div class="note">De ${esc(o.origin||'')} a ${esc(o.addr.city)}${when}. Rastréala en la página de ${esc(d.carrier)}.</div>`

}
function timelineHtml(o){ return `<div class="tl">${o.timeline.map(x=>`<div><b>${esc(STATES[x.s]?.label||x.s)}</b> <span class="note">${x.t}</span>${x.note?`<div class="note">${esc(x.note)}</div>`:''}</div>`).join('')}</div>`; }
function setState(o, st, note, opts={}){
  o.status=st; o.timeline.push({t:now(), s:st, note: note || STATES[st].buyer});
  if(!opts.silentBuyer) notify(o.bk, `${BUYER_TITLES[st]||STATES[st].label} · Pedido #${o.id}`, `${o.title}\n${note || STATES[st].buyer}`, {link:'o:'+o.id});
}

/* ---------- Dinero: entrega, garantía, liberación ---------- */
function markDelivered(o, note){
  if(o.ship.type==='dom' && o.ship.mode==='merk' && !o.domCounted){ S.earnings.domicilios += o.ship.tarifa; o.domCounted=true; }
  o.feeAmt=feeAmtOf(o); o.net=o.sellerGross-o.feeAmt;
  o.deliveredAt=T(); o.releaseAt=addBusinessDays(o.deliveredAt, S.cfg.holdDays);
  SEL(o.sk).sales++;
  setState(o,'entregado', (note?note+' ':'')+`Tienes garantía hasta el ${fdate(o.releaseAt)} (${S.cfg.holdDays} días hábiles).`);
  notify(o.sk, `Pedido #${o.id} entregado`, `Tu dinero (${cop(o.net)}) se libera el ${fdate(o.releaseAt)}, cuando termine la garantía.`);
}
function release(o){
  if(o.status!=='entregado') return;
  const s=SEL(o.sk);
  setState(o,'liberado');
  if(o.sk===OFFICIAL){ S.earnings.official+=o.net; o.liquidated=true; }
  else { S.earnings.commissions+=commOf(o); S.earnings.proc+=(o.proc||0); s.available+=o.net; notify(o.sk, `Pedido #${o.id}: dinero listo`, `Terminó la garantía. MER-K te transferirá ${cop(o.net)} a tu cuenta.`); }
}
function refund(o){
  setState(o,'devuelto'); P(o.pid) && P(o.pid).stock++;
  notify(o.sk, `Pedido #${o.id}: devolución`, 'MER-K le devolvió el dinero al comprador. Esta venta no se paga.');
}
function autoRelease(){ let ch=false; S.orders.forEach(o=>{ if(o.status==='entregado' && T()>=o.releaseAt){ release(o); ch=true; } }); if(ch) save(); }
function received(id){ const o=O(id); markDelivered(o,'Confirmaste que recibiste tu pedido.'); save(); toast(`¡Gracias! Tienes garantía hasta el ${fdate(o.releaseAt)}.`); render(); }
function claim(id){ const o=O(id); o.prevStatus=o.status; setState(o,'reclamo'); notify('admin', `Reclamo · Pedido #${o.id}`, `${o.title} · ${BUY(o.bk).name}`); save(); toast('Reclamo abierto. Tu dinero sigue protegido mientras lo revisamos.'); render(); }

    else t='Le pediste a MER-K un domiciliario. Ten el pedido empacado y marcado con el número de pedido; te avisamos a qué hora pasa a recoger.';

  const next = {pagado:'comanda', comanda:'preparando', preparando:o.ship.mode==='merk'?'agendado':'despachado', agendado:'despachado', despachado:'entregado'}[o.status];

    <div class="split">

let chatKey=null, chatAs='b';
const TESTS=['¿Lo tienes en otro color?','escríbeme al 301 170 6253','tres cero uno uno siete cero seis dos cinco tres','mi wpp es tr3s c3ro 1 uno 7','búscame en insta @mitienda','301','170','6253','¿Lo dejas en $1.250.000?'];
/* Chats: 'p<producto>:<comprador>' preguntas comprador↔vendedor (con filtro) · 'o<pedido>:b' comprador↔MER-K · 'o<pedido>:s' vendedor↔MER-K */
const tPid = k => +k.slice(1).split(':')[0];
function chatInfo(k){
  if(k[0]==='p'){ const p=P(tPid(k)); return {title:'Pregunta · '+(p?p.t:'producto'), sk:p?.s, bk:k.split(':')[1], filter:true}; }
  const o=O(tPid(k)); return {title:'Pedido #'+o.id+' · '+o.title, o, party:k.endsWith(':b')?'b':'s', filter:false};
}
function chatTitle(k){ return chatInfo(k).title; }
function openChat(key, as){
  if(as==='b' && !isRole('buyer')){ loginModal('Inicia sesión como comprador para escribir.'); return; }
  if(key[0]==='p' && !key.includes(':')) key += ':'+me().key;
  chatKey=key; chatAs=as; S.chats[key]=S.chats[key]||[]; drawChat();
}
const roleOf = as => as==='b' ? 'b' : as==='admin' ? 'a' : 's';
const WHO = {b:'Comprador', s:'Vendedor', a:'MER-K'};
function drawChat(){
  const info=chatInfo(chatKey), list=S.chats[chatKey], mine=roleOf(chatAs);
  const other = chatKey[0]==='p' ? (mine==='b' ? SEL(info.sk).name : BUY(info.bk).name.split(' ')[0]) : (mine==='a' ? (info.party==='b' ? BUY(info.o.bk).name+' (comprador)' : SEL(info.o.sk).name+' (vendedor)') : 'MER-K');
  openModal(`<div class="chat"><div class="chead"><h3>${esc(other)}</h3><span class="note">${esc(info.title)}${info.filter?' · Chat seguro: los datos de contacto se bloquean.':''}</span></div>
    <div class="msgs" id="msgs">${info.filter?'<div class="sys info">Por tu seguridad, las ventas se hacen solo por MER-K. No compartas teléfonos, correos ni redes.</div>':'<div class="sys info">Conversación directa con el equipo de MER-K sobre este pedido.</div>'}
      ${list.map(m=>m.sys?`<div class="sys">${esc(m.text)}</div>`:`<div class="msg ${m.from===mine?'b':'s'} ${m.hidden?'hid':''}"><small>${WHO[m.from]}</small>${m.hidden?'Mensaje ocultado por contener datos de contacto':esc(m.text)}</div>`).join('')}</div>
    ${info.filter&&!LIVE?`<div class="tests"><span class="note" style="align-self:center">Pruebas del filtro:</span>${TESTS.map((t,i)=>`<button onclick="sendMsg(TESTS[${i}])">${esc(t)}</button>`).join('')}</div>`:''}
    <form class="cinput" onsubmit="event.preventDefault();sendMsg($('#cm').value)"><input id="cm" placeholder="Escribe un mensaje…" autocomplete="off"><button class="btn">Enviar</button></form></div>`);
  const box=$('#msgs'); box.scrollTop=box.scrollHeight; setTimeout(()=>$('#cm')?.focus(),50);
}
function sendMsg(text){
  text=String(text||'').trim(); if(!text) return;
  const info=chatInfo(chatKey), list=S.chats[chatKey], from=roleOf(chatAs);
  if(info.filter){
    const acc = from==='b' ? BUY(me().key) : SEL(info.sk), who=acc.name, key=chatKey+'|'+from;
    if(acc.status!=='activa'){ list.push({sys:1, text:`La cuenta de ${who} está ${acc.status}. No puede enviar mensajes.`}); save(); drawChat(); return; }
    const r=check(text);
    if(!r.ok){ S.frag[key]=null; const m=strike(acc, who, text, r.reason, 'Chat'); list.push({sys:1, text:`Mensaje bloqueado (${r.reason}). ${m}`}); save(); drawChat(); return; }
    if(r.digits.length>=2 && r.letters<=3){
      const f=S.frag[key]||{digits:'',idxs:[]};
      if(f.digits.length+r.digits.length>=7){ f.idxs.forEach(i=>{ if(list[i]) list[i].hidden=true; }); S.frag[key]=null;

function saveStore(e){
  e.preventDefault(); const sk=me().key, s=SEL(sk), st=storeOf(sk), val=id=>($('#'+id)?.value||'').trim();
  const f={about:val('stAbout')};
  if(can(sk,'tienda2')) Object.assign(f,{slogan:val('stSlogan'), hours:'', policy:'', theme:$('input[name=stTheme]:checked')?.value||st.theme});
  let slug=st.slug;
  if(can(sk,'tienda3')){ f.notice=val('stNotice'); slug=slugify(val('stSlug')||s.name); }
  const r=check([f.about,f.slogan,f.hours,f.policy,f.notice,slug.replace(/-/g,' ')].filter(Boolean).join(' \n '));
  if(!r.ok){ const m=strike(s, s.name, [f.slogan,f.about,f.notice].filter(Boolean).join(' · '), r.reason, 'Personalización de tienda'); save(); toast('No se guardó: '+r.reason+'. '+m); render(); return; }
  const other=skBySlug(slug); if(other && other!==sk){ toast('Esa dirección ya la usa otra tienda. Prueba con otra.'); return; }
  Object.assign(st, f, {slug});
  const files=[['stLogo','logo'],['stBanner','banner']].map(([id,k])=>[$('#'+id)?.files?.[0],k]).filter(x=>x[0]);

  let n=files.length; if(!n) return finish();
  files.forEach(([file,k])=>{ const rd=new FileReader(); rd.onload=()=>shrink(rd.result, img=>{ if(img) st[k]=img; if(--n===0) finish(); }); rd.readAsDataURL(file); });
}

const couponLive = c => c.active && (!c.until || T() <= Date.parse(c.until+'T23:59:59')) && (!c.max || c.used < c.max);

function couponsTab(sk){

  return `<div class="split"><div class="panel"><h3>Mis cupones</h3>${list.length?`<div class="tw"><table><tr><th>Código</th><th>Descuento</th><th>Usos</th><th>Vence</th><th>Estado</th><th></th></tr>${list.map(c=>`<tr>

      <td style="text-align:right;white-space:nowrap"><button class="btn ghost sm" onclick="toggleCoupon(${c.id})">${c.active?'Pausar':'Activar'}</button> <button class="btn bad sm" onclick="delCoupon(${c.id})">Eliminar</button></td></tr>`).join('')}</table></div>`
    :'<p class="empty">Aún no tienes cupones. Crea el primero.</p>'}
    <p class="note" style="margin:12px 0 0">El comprador escribe el código al pagar. El descuento lo asumes tú, aplica solo al producto (no al envío) y la comisión se calcula sobre el precio con descuento.</p></div>
    <div class="panel"><h3>Crear cupón</h3><form class="form" onsubmit="saveCoupon(event)">
      <label>Código<input id="cpCode" required maxlength="15" placeholder="Ej: BIENVENIDA" style="text-transform:uppercase"><span class="note" style="font-weight:500">De 4 a 15 letras o números, sin espacios.</span></label>
      <div class="row2"><label>Tipo<select id="cpType"><option value="pct">Porcentaje (%)</option><option value="fixed">Valor fijo ($)</option></select></label><label>Descuento<input id="cpVal" type="number" min="1" required placeholder="10"></label></div>
      <div class="row2"><label>Compra mínima<input id="cpMin" type="number" min="0" step="1000" value="0"></label><label>Usos máximos (0 = sin límite)<input id="cpMax" type="number" min="0" value="0"></label></div>
      <label>Válido hasta (opcional)<input id="cpUntil" type="date" min="${todayISO()}"></label>
      ${pro?`<label class="check"><input type="checkbox" id="cpPub" checked> Mostrarlo en mi tienda para que lo rediman y avisarles a mis seguidores</label>`:upsell('Con el plan Pro tus cupones se muestran solos en tu tienda y en tus productos.','pro')}
      <div><button class="btn">Crear cupón</button></div></form></div></div>`;
}
function saveCoupon(e){
  e.preventDefault(); const sk=me().key, code=$('#cpCode').value.trim().toUpperCase(), type=$('#cpType').value, value=+$('#cpVal').value;
  if(!/^[A-Z0-9]{4,15}$/.test(code)){ toast('El código debe tener de 4 a 15 letras o números, sin espacios.'); return; }
  if(/\d{5,}/.test(code) || !check(code).ok){ toast('El código no puede tener datos de contacto ni más de 4 números seguidos.'); return; }
  if(S.coupons.some(c=>c.sk===sk && c.code===code)){ toast('Ya tienes un cupón con ese código.'); return; }
  if(type==='pct' && (value<1||value>70)){ toast('El porcentaje debe estar entre 1 % y 70 %.'); return; }
  const c={id:S.nextCoupon++, sk, code, type, value, min:+$('#cpMin').value||0, max:+$('#cpMax').value||0, until:$('#cpUntil').value||'', used:0, active:true, pub:!!$('#cpPub')?.checked && can(sk,'promos')}; S.coupons.unshift(c);
  if(c.pub) notifyFollowers(sk, `🎟️ ${SEL(sk).name} lanzó un cupón`, `${couponLabel(c)} con el código ${code}. Entra a la tienda y redímelo.`, storeUrl(sk));
  save(); toast('Cupón '+code+' creado.'); render();
}
function toggleCoupon(id){ const c=S.coupons.find(x=>x.id===id); c.active=!c.active; save(); render(); }
function delCoupon(id){ S.coupons=S.coupons.filter(x=>x.id!==id); save(); toast('Cupón eliminado.'); render(); }
function findCoupon(code, p){
  code=String(code||'').trim().toUpperCase(); if(!code) return null;
  const price=finalPrice(p), c=S.coupons.find(x=>x.sk===p.s && x.code===code);
  if(!c || !can(p.s,'cupones')) return {err:'Ese cupón no existe en esta tienda.'};
  if(!couponLive(c)) return {err:'Ese cupón ya no está vigente.'};
  if(c.min && price < c.min) return {err:`Este cupón aplica en compras desde ${cop(c.min)}.`};
  const amount=Math.max(0, Math.min(price-1000, c.type==='pct'?Math.round(price*c.value/100):c.value));
  return {c, code, amount};
}
let CO_CP=null;
function applyCoupon(id){ const r=findCoupon($('#coCode').value, P(id)); const m=$('#coCpMsg');
  if(!r){ CO_CP=null; m.textContent=''; }
  else if(r.err){ CO_CP=null; m.innerHTML=`<span class="alert">${esc(r.err)}</span>`; }
  else { CO_CP=r.code; m.innerHTML=`<span class="badge">Cupón ${esc(r.code)} aplicado: −${cop(r.amount)}</span>`; }
  coRefresh(id); }
function useCoupon(id, code){ $('#coCode').value=code; applyCoupon(id); }
const publicCoupons = sk => can(sk,'promos') ? S.coupons.filter(c=>c.sk===sk && c.pub && couponLive(c)) : [];

/* ---------- Inventario ---------- */
function logStock(p, delta, reason){ (S.stockLog||(S.stockLog=[])).unshift({pid:p.id, sk:p.s, title:p.t, delta, stock:p.stock, reason, t:now()}); if(S.stockLog.length>300) S.stockLog.length=300; }
function lowStockCheck(p){ const th=SEL(p.s).lowStock??3; if(can(p.s,'inventario') && p.stock<=th) notify(p.s, p.stock?'⚠️ Inventario bajo':'⚠️ Producto agotado', `${p.t}: ${p.stock?'quedan '+p.stock+' unidades':'se agotó y ya no se muestra en la página'}. Actualiza tu inventario.`); }
const soldOf = pid => S.orders.filter(o=>o.pid===pid && o.status!=='devuelto').length;
function inventoryTab(sk){
  if(!can(sk,'inventario')) return lockBox('inventario','Gestión de inventario','Controla tus unidades, recibe alertas de inventario bajo y revisa cada entrada y salida.');
  const s=SEL(sk), th=s.lowStock??3, mine=S.products.filter(p=>p.s===sk), log=(S.stockLog||[]).filter(x=>x.sk===sk).slice(0,15);
  const units=mine.reduce((a,p)=>a+p.stock,0), value=mine.reduce((a,p)=>a+p.stock*finalPrice(p),0);
  return `<div class="kpis"><div class="kpi"><small>Productos</small><div>${mine.length}</div></div><div class="kpi"><small>Unidades en inventario</small><div>${units}</div></div>
    <div class="kpi"><small>Valor del inventario</small><div>${cop(value)}</div><span class="note">A precio de venta</span></div>
    <div class="kpi"><small>Con inventario bajo</small><div>${mine.filter(p=>p.stock>0&&p.stock<=th).length}</div><span class="note">${th} unidades o menos</span></div><div class="kpi"><small>Agotados</small><div>${mine.filter(p=>p.stock<1).length}</div></div></div>
    <div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><h3 style="margin:0">Inventario</h3><button class="btn ghost sm" onclick="exportInv()">Descargar en Excel (CSV)</button></div>
    ${mine.length?`<div class="tw"><table><tr><th>Producto</th><th>Referencia</th><th>Vendidos</th><th>Unidades</th><th>Estado</th></tr>${mine.map(p=>`<tr>
      <td>${p.img?'':p.e} ${esc(p.t)}<br><span class="note">${cop(finalPrice(p))}</span></td>
      <td><input class="ref" value="${esc(p.sku||'')}" maxlength="20" placeholder="Ej: BOL-001" onchange="setSku(${p.id},this.value)"></td><td>${soldOf(p.id)}</td>
      <td><div class="qty"><button onclick="adjStock(${p.id},-1)" aria-label="Quitar una">−</button><input type="number" min="0" value="${p.stock}" onchange="setStock(${p.id},this.value)"><button onclick="adjStock(${p.id},1)" aria-label="Agregar una">+</button></div></td>
      <td>${p.stock<1?'<span class="badge bad">Agotado</span>':p.stock<=th?'<span class="badge warn">Inventario bajo</span>':'<span class="badge">Disponible</span>'}</td></tr>`).join('')}</table></div>`:'<p class="empty">Aún no tienes productos.</p>'}</div>
    <div class="split"><div class="panel"><h3>Alerta de inventario bajo</h3><form class="form" onsubmit="event.preventDefault();saveLowStock()">
      <label>Avísame con la campanita 🔔 cuando un producto tenga<div style="display:flex;align-items:center;gap:8px"><input id="lsTh" type="number" min="0" max="100" value="${th}" style="width:90px"><span>unidades o menos</span></div></label><div><button class="btn">Guardar</button></div></form></div>
    <div class="panel"><h3>Movimientos recientes</h3>${log.length?`<table><tr><th>Fecha</th><th>Producto</th><th>Cambio</th><th>Quedan</th></tr>${log.map(x=>`<tr><td class="note">${x.t}</td><td>${esc(x.title)}<br><span class="note">${esc(x.reason)}</span></td><td><b style="color:${x.delta<0?'var(--bad)':'var(--pear-d)'}">${x.delta>0?'+':''}${x.delta}</b></td><td>${x.stock}</td></tr>`).join('')}</table>`:'<p class="empty">Aún no hay movimientos.</p>'}</div></div>`;
}
function adjStock(id, d){ const p=P(id); if(p.stock+d<0) return; p.stock+=d; logStock(p, d, 'Ajuste manual'); if(d<0) lowStockCheck(p); save(); render(); }
function setStock(id, v){ const p=P(id), n=Math.max(0, Math.round(+v||0)), d=n-p.stock; if(!d) return; p.stock=n; logStock(p, d, 'Ajuste manual'); if(d<0) lowStockCheck(p); save(); toast('Inventario actualizado.'); render(); }
function download(name, text){ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('Archivo descargado.'); }catch(e){ toast('No se pudo descargar aquí.'); } }
const csv = rows => rows.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(';')).join('\n');
function exportInv(){ const sk=me().key; download('inventario-mer-k.csv', csv([['Producto','Referencia','Precio','Unidades','Vendidos','Estado'], ...S.products.filter(p=>p.s===sk).map(p=>[p.t,p.sku||'',finalPrice(p),p.stock,soldOf(p.id),p.paused?'Pausado':p.stock<1?'Agotado':'Publicado'])])); }

    ${vals.map((v,i)=>{ const h=v?Math.max(3,Math.round(v/max*(H-14))):0; return `<rect x="${(i*bw+2).toFixed(1)}" y="${H-h}" width="${(bw-4).toFixed(1)}" height="${h}" rx="3" fill="${color}"><title>${labels[i]}: ${cop(v)}</title></rect>`; }).join('')}
    <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="#D9D2EA"/>

}
function hBars(rows, color){ if(!rows.length) return '<p class="empty">Aún no hay datos.</p>'; const max=Math.max(1,...rows.map(r=>r[1]));

/* ---------- Mis cuentas (plan Pro): todo lo vendido dentro de MER-K, calculado solo ---------- */
const monthKey = ts => { const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
const monthName = k => { const [y,m]=k.split('-'); return new Date(+y, +m-1, 15).toLocaleDateString('es-CO',{month:'long', year:'numeric'}); };
const netOf = o => o.sellerGross - feeAmtOf(o);
const moneyState = o => o.status==='devuelto' ? ['Devuelto al comprador','bad'] : o.liquidated ? ['Pagado a tu cuenta',''] : o.status==='liberado' ? ['Listo para pagarte','blue']
  : o.status==='entregado' ? ['En garantía hasta el '+fdate(o.releaseAt),'warn'] : o.status==='reclamo' ? ['En reclamo','bad'] : ['Pedido en curso','lav'];
function monthTotals(sk, k){
  const all=S.orders.filter(o=>o.sk===sk && monthKey(o.ts||0)===k), ok=all.filter(o=>o.status!=='devuelto');
  return {all, ok, n:ok.length, sales:ok.reduce((a,o)=>a+o.price,0), ship:ok.reduce((a,o)=>a+(o.sellerGross-o.price),0), comm:ok.reduce((a,o)=>a+commOf(o),0), proc:ok.reduce((a,o)=>a+(o.proc||0),0),
    net:ok.reduce((a,o)=>a+netOf(o),0), paid:ok.filter(o=>o.liquidated).reduce((a,o)=>a+netOf(o),0), refunds:all.length-ok.length};
}
function ledgerTab(sk){
  if(!can(sk,'cuentas')) return lockBox('cuentas','Mis cuentas','Lleva el registro de todo lo que vendes en MER-K: cada venta, cuánto te queda después de comisiones, cuánto ya te pagamos y cuánto ganaste cada mes. Todo se calcula solo.');
  const months=[...Array(6)].map((_,i)=>{ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); return monthKey(d); });
  const k=S.ui.ledgerMonth && months.includes(S.ui.ledgerMonth) ? S.ui.ledgerMonth : months[0], m=monthTotals(sk,k);
  const hist=months.map(x=>[x, monthTotals(sk,x)]).reverse(), byProd=groupSum(m.ok, o=>o.title, o=>netOf(o)), units=groupSum(m.ok, o=>o.title, ()=>1);
  return `<div class="panel" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><h3 style="margin:0">Mis cuentas</h3><span class="note">Todo lo que vendes en MER-K queda registrado aquí solo: ventas, comisiones, lo que te queda y lo que ya te pagamos.</span></div>
      <label class="note" style="display:flex;gap:6px;align-items:center">Mes <select onchange="S.ui.ledgerMonth=this.value;render()" style="border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:700">${months.map(x=>`<option value="${x}" ${x===k?'selected':''}>${monthName(x)}</option>`).join('')}</select></label></div>
    <div class="kpis"><div class="kpi"><small>Ventas del mes</small><div>${cop(m.sales)}</div><span class="note">${m.n} ${m.n===1?'venta':'ventas'}${m.refunds?' · '+m.refunds+' devueltas':''}</span></div>
      <div class="kpi"><small>Envíos cobrados</small><div>${cop(m.ship)}</div><span class="note">Lo que pagaron los compradores</span></div>
      <div class="kpi"><small>Comisión MER-K</small><div>${cop(m.comm)}</div></div>
      <div class="kpi"><small>Procesamiento de pago</small><div>${cop(m.proc)}</div></div>
      <div class="kpi"><small>Te quedan</small><div>${cop(m.net)}</div><span class="note">Ventas + envíos − comisión − procesamiento</span></div>
      <div class="kpi"><small>Ya te pagamos</small><div>${cop(m.paid)}</div><span class="note">Por cobrar: ${cop(m.net-m.paid)}</span></div></div>
    <div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><h3 style="margin:0">Ventas de ${monthName(k)}</h3><button class="btn ghost sm" onclick="exportLedger('${k}')">Descargar en Excel (CSV)</button></div>
      ${m.all.length?`<div class="tw"><table><tr><th>Fecha</th><th>Pedido</th><th>Venta</th><th>Envío</th><th>Comisión + proc.</th><th>Te queda</th><th>Estado del dinero</th></tr>${m.all.map(o=>{ const [lbl,cls]=moneyState(o); return `<tr>
        <td class="note">${o.created}</td><td><b>#${o.id}</b> ${esc(o.title)}<br><span class="note">a ${esc(o.addr.city)}${o.coupon?' · cupón '+esc(o.coupon.code)+' −'+cop(o.coupon.amount):''}</span></td>
        <td>${cop(o.price)}</td><td>${cop(o.sellerGross-o.price)}</td><td>−${cop(feeAmtOf(o))}</td><td><b>${o.status==='devuelto'?'$0':cop(netOf(o))}</b></td><td><span class="badge ${cls}">${lbl}</span></td></tr>`; }).join('')}</table></div>`:'<p class="empty">No tuviste ventas este mes.</p>'}</div>
    <div class="split"><div class="panel"><h3>Lo que más vendiste</h3>${byProd.length?hBars(byProd.slice(0,6).map(([t,v])=>[t+' ('+units.find(u=>u[0]===t)[1]+')', v, cop(v)]),'#A88AED'):'<p class="empty">Aún no hay datos.</p>'}</div>
      <div class="panel"><h3>Últimos 6 meses</h3><div class="tw"><table><tr><th>Mes</th><th>Ventas</th><th>Te quedan</th></tr>${hist.map(([x,t])=>`<tr><td>${monthName(x)}</td><td>${cop(t.sales)} <span class="note">(${t.n})</span></td><td><b>${cop(t.net)}</b></td></tr>`).join('')}</table></div></div></div>
    <p class="note">Es una ayuda para llevar las cuentas de lo que vendes en MER-K; no reemplaza a un contador.</p>`;
}
function exportLedger(k){ const sk=me().key, m=monthTotals(sk,k);
  download('ventas-mer-k-'+k+'.csv', csv([['Fecha','Pedido','Producto','Ciudad','Venta','Envío','Cupón','Comisión','Procesamiento','Te queda','Estado del dinero'],
    ...m.all.map(o=>[o.created, o.id, o.title, o.addr.city, o.price, o.sellerGross-o.price, o.coupon?.amount||0, commOf(o), o.proc||0, o.status==='devuelto'?0:netOf(o), moneyState(o)[0]])])); }

/* ---------- Notificaciones que se pueden tocar (como Mercado Libre) ---------- */
let NOTIF_LIST = [];
function notifLink(n){
  if(n.link) return n.link;
  if(n.tk) return 'tk:'+n.tk;
  if(n.oid) return 'o:'+n.oid;
  const t=n.title+' '+n.body, m=/#(\d{4,})/.exec(n.title) || /[Pp]edido #(\d{4,})/.exec(t);
  if(m) return 'o:'+m[1];
  if(/plan|mensualidad/i.test(n.title)) return 'plan';
  if(/transferimos|dinero/i.test(n.title)) return 'dinero';
  if(/inventario|agotado/i.test(n.title)) return 'inventario';
  if(/mensaje de mer-k/i.test(n.title)) return 'mensajes';
  if(/pregunta|vendedor respondió/i.test(n.title)) return 'mensajes';
  if(/cuenta bancaria/i.test(n.title)) return 'pagos';
  if(/anti-contacto/i.test(n.title)) return 'alertas';
  return null;
}
function notifHtml(list){
  NOTIF_LIST = list;
  return list.length ? list.map((n,i)=>{ const l=notifLink(n); return `<div class="notif ${n.read?'':'new'} ${l?'click':''}" ${l?`onclick="openNotif(${i})"`:''}><b>${esc(n.title)}</b><span class="note">${n.t}</span><div class="nbody">${esc(n.body)}</div>${l?'<span class="go">Ver →</span>':''}</div>`; }).join('')
    : '<p class="empty">No tienes notificaciones.</p>';
}
function showNotifs(){ const k=me().key, list=S.notifs.filter(n=>n.to===k); openModal(`<div class="mpad"><h2>Notificaciones</h2>${notifHtml(list)}</div>`, true); list.forEach(n=>n.read=true); save(); }
const goHash = h => { if(location.hash===h) render(); else location.hash=h; };
function openNotif(i){
  const n=NOTIF_LIST[i], l=n && notifLink(n), role=me()?.role; if(!l) return;
  if(l.startsWith('tk:')) return openTicket(+l.slice(3));
  $('#scrim').classList.remove('open');
  if(l.startsWith('#')) return goHash(l);
  if(l.startsWith('o:')){ const id=+l.slice(2);
    if(role==='admin'){ render(); if(O(id)) manageOrder(id); return; }
    if(role==='buyer'){ S.ui.buyTab='compras'; goHash('#compras'); } else { S.ui.sellTab='pedidos'; S.ui.sellFilter='todos'; goHash('#vender'); }
    setTimeout(()=>{ const el=document.getElementById('ord-'+id); if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('hl'); setTimeout(()=>el.classList.remove('hl'), 2600); } }, 250);
    return; }
  if(role==='seller' && ['plan','dinero','inventario','mensajes','soporte'].includes(l)){ S.ui.sellTab=l; return goHash('#vender'); }
  if(role==='admin' && ['pagos','alertas','soporte','planes'].includes(l)){ S.ui.adminTab=l; return goHash('#admin'); }
  if(role==='admin' && l.startsWith('msj:')) return adminMsgSeller(l.slice(4));
  if(role==='buyer' && l==='soporte'){ S.ui.buyTab='soporte'; return goHash('#compras'); }
  render();
}

const stars = v => { const f=Math.round(v); return `<span class="stars" aria-label="${(+v).toFixed(1)} de 5">${'★'.repeat(f)}<i>${'★'.repeat(5-f)}</i></span>`; };

function rateBox(o){
  if(!['entregado','liberado'].includes(o.status)) return '';

  if(r) return `<div class="ratebox done">Calificaste a <b>${esc(SEL(o.sk).name)}</b>: ${stars(r.stars)}</div>`;

function rateOrder(id, n){ const o=O(id), s=SEL(o.sk), c=s.ratingCount||0;

/* ---------- Seguir tiendas y redimir cupones ---------- */
const follows = (bk, sk) => (S.follows||[]).some(f=>f.bk===bk && f.sk===sk);
const claimed = (bk, cid) => (S.claims||[]).some(c=>c.bk===bk && c.cid===cid);
function notifyFollowers(sk, title, body, link){ (S.follows||[]).filter(f=>f.sk===sk).forEach(f=>notify(f.bk, title, body, {link})); }
function toggleFollow(sk){
  if(!isRole('buyer')){ loginModal('Inicia sesión como comprador para seguir tiendas y enterarte de sus promociones.'); return; }
  const bk=me().key, was=follows(bk,sk);
  S.follows = was ? S.follows.filter(f=>!(f.bk===bk&&f.sk===sk)) : [...(S.follows||[]), {bk,sk}];
  save(); toast(was?'Dejaste de seguir esta tienda.':'¡Ahora sigues esta tienda! Te avisamos de sus cupones y ofertas.'); render(); }
function claimCoupon(cid){
  if(!isRole('buyer')){ loginModal('Inicia sesión como comprador para guardar cupones.'); return; }
  const bk=me().key; if(!claimed(bk,cid)) (S.claims||(S.claims=[])).push({bk,cid});
  save(); toast('¡Cupón guardado! Se aplica solo cuando compres en esta tienda.'); render(); }

}

function deleteBlockers(){
  const u=me(), out=[];
  const act=S.orders.filter(o=>ACTIVE_ST.includes(o.status) && (u.role==='seller' ? o.sk===u.key : o.bk===u.key));
  if(act.length) out.push(`Tienes ${act.length} pedido${act.length>1?'s':''} en curso (${act.slice(0,4).map(o=>'#'+o.id).join(', ')}${act.length>4?'…':''}). Espera a que terminen, incluida la garantía.`);
  if(u.role==='seller' && SEL(u.key).available>0) out.push(`MER-K todavía te debe transferir ${cop(SEL(u.key).available)}. Espera esa transferencia antes de borrar la cuenta.`);

}

function readFileShrunk(file, max){ return new Promise(ok=>{ if(!file) return ok(null); const rd=new FileReader(); rd.onload=()=>shrink(rd.result, ok, max); rd.readAsDataURL(file); }); }
async function storeBannerImage(dataUrl){ return dataUrl; }
async function saveBanners(list, msg){ S.cfg.banners=list; save(); toast(msg); render(); }

}

/* =====================================================================
   CARRITO DE COMPRAS (se guarda en este navegador)
   ===================================================================== */
const CART_KEY='merk-cart';
function cartRaw(){ try{ const c=JSON.parse(localStorage.getItem(CART_KEY)||'[]'); return Array.isArray(c)?c.filter(i=>i&&i.pid):[]; }catch(e){ return []; } }
function cartGet(){ return cartRaw().filter(i=>{ const p=P(i.pid); return p && !p.paused && p.stock>0; }).map(i=>({pid:i.pid, qty:Math.max(1, Math.min(+i.qty||1, P(i.pid).stock))})); }
function cartSet(list){ try{ localStorage.setItem(CART_KEY, JSON.stringify(list)); }catch(e){} const a=$('#acct'); if(a) a.innerHTML=headerRight(); }
function cartCount(){ return cartGet().reduce((n,i)=>n+i.qty,0); }
function cartBtn(){ const n=cartCount(); return `<button class="bell cartbtn" onclick="showCart()" aria-label="Carrito de compras">🛒${n?`<span>${n}</span>`:''}</button>`; }
function canShop(){ const s=me(); if(s && s.role!=='buyer'){ toast('Para comprar necesitas una cuenta de comprador.'); return false; } return true; }
function addToCart(pid){
  if(!canShop()) return;
  const p=P(pid); if(!p || p.stock<1){ toast('Este producto se agotó.'); return; }
  const c=cartRaw(), it=c.find(i=>i.pid===pid);
  if(it){ if(it.qty>=p.stock){ toast(`Solo hay ${p.stock} disponibles y ya están en tu carrito.`); return; } it.qty++; } else c.push({pid, qty:1});
  cartSet(c); closeModal(); toast('🛒 Agregado al carrito. ¡Sigue comprando!');
}
function showCart(){
  const items=cartGet(); cartSet(items);
  if(!items.length){ openModal(`<div class="mpad" style="text-align:center"><div style="font-size:46px">🛒</div><h2>Tu carrito está vacío</h2><p class="sub">Toca “Agregar y seguir comprando” en los productos que te gusten y aquí se van sumando.</p><button class="btn" onclick="closeModal();location.hash='#inicio'">Ver productos</button></div>`, true); return; }
  const sub=items.reduce((a,i)=>a+finalPrice(P(i.pid))*i.qty,0), n=items.reduce((a,i)=>a+i.qty,0);
  openModal(`<div class="mpad"><h2>🛒 Tu carrito</h2><p class="sub">${n} producto${n>1?'s':''}</p>
    <div class="cart">${items.map(i=>{ const p=P(i.pid); return `<div class="citem"><div class="cthumb" style="${thumbStyle(p)}">${thumbInner(p)}</div>
      <div class="cinfo"><b>${esc(p.t)}</b><span class="note">${esc(SEL(p.s).name)} · ${cop(finalPrice(p))} c/u</span>
        <div class="qty"><button onclick="cartQty(${p.id},-1)" aria-label="Quitar uno">−</button><span>${i.qty}</span><button onclick="cartQty(${p.id},1)" aria-label="Agregar uno">+</button><a class="note" href="javascript:cartRemove(${p.id})">Quitar</a></div></div>
      <b class="cline">${cop(finalPrice(p)*i.qty)}</b></div>`; }).join('')}</div>
    <table class="sum" style="margin-top:12px"><tr><td><b>Subtotal</b></td><td style="text-align:right"><b class="price">${cop(sub)}</b></td></tr></table>
    <p class="note" style="margin:4px 0 14px">El domicilio o envío y los cupones se calculan en el siguiente paso.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" style="flex:1" onclick="startCheckout(cartGet(),'cart')">Pagar</button><button class="btn ghost" onclick="closeModal()">Seguir comprando</button></div></div>`, true);
}
function cartQty(pid, d){ const c=cartRaw(), it=c.find(i=>i.pid===pid), p=P(pid); if(!it) return; it.qty=(+it.qty||1)+d; if(p && it.qty>p.stock){ it.qty=p.stock; toast(`Solo hay ${p.stock} disponibles.`); } cartSet(c.filter(i=>i.qty>0)); showCart(); }
function cartRemove(pid){ cartSet(cartRaw().filter(i=>i.pid!==pid)); showCart(); }

/* =====================================================================

let CO = {items:[]};
const errText = e => typeof friendly==='function' ? friendly(e) : String(e?.message||e);
function buyNow(pid){ if(!canShop()) return; startCheckout([{pid, qty:1}], 'now'); }
function startCheckout(items, mode){
  if(!isRole('buyer')){ loginModal(me()?'Para comprar necesitas una cuenta de comprador.':'Inicia sesión o crea tu cuenta de comprador para pagar. Tu carrito queda guardado.'); return; }

  CO={items, mode, addr:null, carriers:{}, coupon:null, cpMsg:null, q:null};
  coStep1();
}
function coSteps(n){ return `<div class="costeps"><span class="${n===1?'on':'done'}" ${n===2?'onclick="coStep1()"':''}>1. Datos de entrega</span><span class="${n===2?'on':''}">2. Pago</span></div>`; }

/* Cotización del carrito (en la página real la calcula el servidor) */
async function cartQuote(items, city, carriers, coupon){
  const code=String(coupon||'').trim().toUpperCase(); let cpErr=code?'Ese cupón no aplica a los productos de tu compra.':null, cpUsed=null;
  const groups={}; items.forEach(i=>{ const p=P(i.pid); if(!p || p.paused || p.stock<1) throw new Error('Uno de los productos ya no está disponible. Revisa tu carrito.');
    if(p.stock<i.qty) throw new Error(`De "${p.t}" solo quedan ${p.stock} unidades.`); (groups[p.s]||(groups[p.s]=[])).push({p, qty:i.qty}); });
  const out=Object.entries(groups).map(([sk, lines])=>{
    const list=lines.reduce((a,l)=>a+finalPrice(l.p)*l.qty,0); let disc=0;
    if(code && !cpUsed){ const c=S.coupons.find(x=>x.sk===sk && x.code===code);
      if(c){ if(!can(sk,'cupones')) cpErr='Ese cupón no existe en esta tienda.'; else if(!couponLive(c)) cpErr='Ese cupón ya no está vigente.';
        else if(c.min && list<c.min) cpErr=`Este cupón aplica en compras desde ${cop(c.min)} en ${SEL(sk).name}.`;
        else { disc=Math.max(0, Math.min(list-1000, c.type==='pct'?Math.round(list*c.value/100):c.value)); cpUsed=code; cpErr=null; } } }
    const allFree=lines.every(l=>l.p.freeShip); let ship;
    if(inArea(city) && inArea(SEL(sk).city)){ const tarifa=zonePrice(city); ship={ship_type:'dom', tarifa, free:allFree, ship_cost:allFree?0:tarifa, carrier:null, eta:'Entrega en '+etaDom()}; }
    else { const nc=Math.max(0,...lines.filter(l=>!l.p.freeShip).map(l=>l.p.natCost||0)); ship={ship_type:'nat', tarifa:nc, free:allFree, ship_cost:allFree?0:nc, carrier:CARRIERS.includes(carriers?.[sk])?carriers[sk]:CARRIERS[0], eta:'Entrega en '+etaNat()+' según la transportadora'}; }
    return Object.assign({sk, store:SEL(sk).name, lines:lines.map(l=>({pid:l.p.id, title:l.p.t, qty:l.qty, unit:finalPrice(l.p)})), list, coupon:disc?code:null, coupon_amount:disc, price:list-disc}, ship, {total:list-disc+ship.ship_cost});
  });
  return {groups:out, total:out.reduce((a,g)=>a+g.total,0), coupon:cpUsed, coupon_error:cpUsed?null:cpErr, carriers:CARRIERS};
}
const linesTitle = lines => lines.map(l=>l.title+(l.qty>1?` ×${l.qty}`:'')).join(' + ');

/* Demo: el pago se aprueba al instante y se crea un pedido por tienda */
function coPay(){
  const q=CO.q, a=CO.addr, bk=me().key; if(!q) return;
  const procAll=procParts(q.total).total, ids=q.groups.map(g=>createGroupOrder(g, bk, a, procAll, q.total).id);
  if(CO.mode==='cart'){ const bought=new Set(CO.items.map(i=>i.pid)); cartSet(cartRaw().filter(i=>!bought.has(i.pid))); }
  CO={items:[]}; save(); closeModal(); S.ui.buyTab='compras'; location.hash='#compras'; render();
  toast(ids.length>1?`¡Pago recibido! Tu compra quedó en ${ids.length} pedidos, uno por tienda.`:'¡Pago recibido! Te avisamos cada cambio de tu pedido.');
}
function createGroupOrder(g, bk, a, procAll, total){
  const sk=g.sk, price=g.price;
  const o={id:S.nextOrder++, pid:g.lines[0].pid, items:g.lines.map(l=>({pid:l.pid, title:l.title, qty:l.qty, unit:l.unit})), sk, bk, title:linesTitle(g.lines), price, listPrice:g.list, origin:SEL(sk).city,
    ship:{type:g.ship_type, mode:null, carrier:g.carrier, cost:g.ship_cost, free:!!g.free, tarifa:g.tarifa},
    addr:{name:a.name, dir:a.dir, city:a.city, barrio:a.barrio||'', notes:a.notes||'', phone:a.phone||BUY(bk).phone}, pay:'Pasarela de pagos',
    status:'pagado', fee:feeOf(sk), fixed:fixedOf(sk, price), proc: sk===OFFICIAL?0:Math.round(procAll*g.total/Math.max(1,total)), created:now(), ts:T(),
    coupon:g.coupon?{code:g.coupon, amount:g.coupon_amount}:null, timeline:[{t:now(), s:'pagado', note:STATES.pagado.buyer}]};
  o.sellerGross = price + g.ship_cost;
  if(g.coupon){ const c=S.coupons.find(x=>x.sk===sk && x.code===g.coupon); if(c) c.used++; }
  g.lines.forEach(l=>{ const p=P(l.pid); p.stock=Math.max(0,p.stock-l.qty); logStock(p, -l.qty, 'Venta · pedido #'+o.id); lowStockCheck(p); });
  S.orders.unshift(o);
  notify(bk, `✅ Tu pago fue confirmado · Pedido #${o.id}`, `Compraste "${o.title}" por ${cop(price+g.ship_cost)}. Tu dinero queda protegido en MER-K y te avisamos cada vez que tu pedido avance.`, {link:'o:'+o.id});
  notify('admin', `Nuevo pedido #${o.id} · confirma el pago`, `${o.title} · ${cop(price+g.ship_cost)} · ${SEL(sk).name} → ${a.barrio?a.barrio+', ':''}${a.city} (${g.ship_type==='dom'?'domicilio':'envío por '+g.carrier})`);
  return o;
}

/* =====================================================================
   CALCULADORA DEL VENDEDOR: cuánto recibe de cada venta
   ===================================================================== */
function sellerNet(sk, price, ship=0){
  price=Math.max(0,Math.round(+price||0)); ship=Math.max(0,Math.round(+ship||0));
  const fee=Math.round(price*feeOf(sk)), pp = sk===OFFICIAL ? {pct:0,fx:0,iva:0,total:0} : procParts(price+ship);
  return {price, ship, fee, pp, net: price + ship - fee - pp.total};
}
function sellerCalcRows(sk){
  const v=$('#scPrice')?.value ?? 100000, sh=$('#scShip')?.value ?? 0, r=sellerNet(sk, v, sh), pl=PLAN_INFO[effPlan(sk)]?.name||'';
  return `<table class="sum">
    <tr><td>Valor del producto</td><td style="text-align:right">${cop(r.price)}</td></tr>
    ${r.ship?`<tr><td>Envío que paga el comprador</td><td style="text-align:right">${cop(r.ship)}</td></tr>`:''}
    <tr><td>Comisión MER-K (${fmtPct(+(feeOf(sk)*100).toFixed(2))}, plan ${esc(pl)})</td><td style="text-align:right">−${cop(r.fee)}</td></tr>
    <tr><td>Procesamiento del pago (${fmtPct(S.cfg.wompiPct)} + ${cop(S.cfg.wompiFixed)} + IVA)</td><td style="text-align:right">−${cop(r.pp.total)}</td></tr>
    <tr><td><b>Recibes</b></td><td style="text-align:right"><b class="price">${cop(r.net)}</b></td></tr></table>`;
}

  return `<div class="panel"><h3>🧮 ¿Cuánto recibo por una venta?</h3><p class="note" style="margin-top:-6px">Escribe el valor de tu producto y te mostramos lo que MER-K te transfiere cuando termine la garantía (${S.cfg.holdDays} días hábiles después de entregado). En la tabla de arriba ya ves ese valor para cada producto.</p>

function waNumber(phone){ let d=String(phone||'').replace(/\D/g,''); if(d.length===10 && d[0]==='3') d='57'+d; return d; }

function openWa(phone, text){ if(!waNumber(phone)){ toast('Este pedido no tiene celular del comprador.'); return; } window.open(waLink(phone, text), '_blank', 'noopener'); }
function orderProducts(o){ return (o.items&&o.items.length?o.items:[{title:o.title, qty:1}]).map(l=>l.title+(l.qty>1?` (x${l.qty})`:'')).join(', '); }
function waShipMsg(o){
  const name=String(o.addr?.name||BUY(o.bk).name||'').trim().split(' ')[0], store=SEL(o.sk).name, prods=orderProducts(o), d=o.delivery||{}, pk=o.pickup||{};

    return `${hi} ya fue despachado 📦\n\nTransportadora: ${car}\nNúmero de guía: ${guia}\n\nPuedes rastrearlo en la página de ${car}. ¡Gracias por comprar en MER-K! 💜`;

  return `${hi} ya fue despachado 🛵\n\nTe lo entrega ${who}, mensajero de ${courier()}${when?', el '+when:''}.\nCódigo de seguimiento: ${d.guia||'DOM-'+String(o.id).padStart(6,'0')}\nDirección: ${addrLine(o.addr)}\n\n¡Gracias por comprar en MER-K! 💜`;

function waPanel(o){

let loadSeq = 0;
async function loadAll(){

  const seq = ++loadSeq, role = PROFILE?.role || null, uid = ME?.id || null;
  const T0 = (t, o) => api.sel(t, o).catch(e => { console.warn(t, e); return []; });
  const [cfg, sellers, products, coupons] = await Promise.all([T0('config'), T0('sellers'), T0('products', {order:'created_at'}), T0('coupons', {order:'created_at'})]);
  let ads=[], profs=[], privs=[], addrs=[], orders=[], evs=[], msgs=[], notifs=[], tks=[], tms=[], slog=[], pays=[], subs=[], exps=[], alerts=[], fols=[], cls=[], revs=[], summary=null;
  if(uid){
    [profs, privs, orders, evs, msgs, notifs, tks, tms] = await Promise.all([T0('profiles'), T0('seller_private'), T0('orders', {order:'created_at'}), T0('order_events', {order:'created_at', asc:true}),
      T0('messages', {order:'created_at', asc:true}), T0('notifications', {order:'created_at', limit:150}), T0('tickets', {order:'created_at'}), T0('ticket_messages', {order:'created_at', asc:true})]);
    if(role==='buyer') addrs = await T0('addresses', {order:'created_at', asc:true});

    if(role==='buyer') [fols, cls] = await Promise.all([T0('follows'), T0('coupon_claims')]);
    revs = await T0('reviews');
    if(role==='seller' || role==='admin') ads = await T0('ad_requests', {order:'created_at'});
    if(role==='admin'){ [exps, alerts] = await Promise.all([T0('expenses', {order:'created_at'}), T0('alerts', {order:'created_at', limit:200})]); summary = await api.rpc('admin_summary').catch(()=>null); }
  }
  if(seq !== loadSeq) return;     // llegó una carga más nueva
  if(cfg[0]) Object.assign(S.cfg, cfg[0].data);
  const P_ = Object.fromEntries(profs.map(p=>[p.id, p])), V_ = Object.fromEntries(privs.map(p=>[p.seller_id, p]));

  addrs.forEach(a=>{ const b=S.buyers[a.buyer_id]; if(b) b.addresses.push(mapAddr(a)); });
  const EV = {}; evs.forEach(e=>(EV[e.order_id] = EV[e.order_id] || []).push(e));
  S.orders = orders.filter(o=>!['pendiente_pago','rechazado'].includes(o.status)).map(o=>mapOrder(o, EV[o.id]));
  S.chats = {}; msgs.forEach(m=>(S.chats[m.thread] = S.chats[m.thread] || []).push(m.role==='sys' ? {sys:1, text:m.body, t:fmtTs(m.created_at)} : {from:m.role, text:m.body, t:fmtTs(m.created_at)}));

  S.payouts = pays.map(x=>({sk:x.seller_id, amount:x.amount, ref:x.ref, date:fmtTs(x.created_at)}));
  S.subPays = subs.map(x=>({sk:x.seller_id, plan:x.plan, amount:x.amount, ref:x.ref||'', how:x.how, date:fmtTs(x.created_at), ts:Date.parse(x.created_at)}));

  S.expenses = exps.map(x=>({what:x.concept, amount:x.amount, date:fmtTs(x.created_at)}));
  S.alerts = alerts.map(a=>({when:fmtTs(a.created_at), who:a.who||'', text:a.content||'', reason:a.reason||'', where:a.place||''}));
  if(summary) S.earnings = {commissions:+summary.commissions, official:+summary.official, domicilios:+summary.courier_to_pay, subs:+summary.subs, proc:+summary.proc};

/* ---------- Ayudas ---------- */
function friendly(e){
  let m = String(e?.message || e || 'Algo salió mal.');
  if(/Invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos.';
  if(/Email not confirmed/i.test(m)) return 'Primero confirma tu correo: te enviamos un enlace a tu bandeja de entrada.';
  if(/already registered|already been registered/i.test(m)) return 'Ya existe una cuenta con ese correo.';
  if(/rate limit/i.test(m)) return 'Hiciste muchos intentos seguidos. Espera unos minutos.';
  if(/Failed to fetch|NetworkError/i.test(m)) return 'No hay conexión. Revisa tu internet e inténtalo de nuevo.';
  m = m.replace(/^CONTACTO:\s*/, 'No se guardó: ').replace(/^LIMITE:\s*/, '').replace(/^PROHIBIDO:\s*/, '');
  if(/row-level security|permission denied/i.test(m)) return 'No tienes permiso para hacer esto.';
  return m;
}
async function act(fn, okMsg, opts={}){
  const btn = document.activeElement?.tagName==='BUTTON' ? document.activeElement : null;
  if(btn){ if(btn.dataset.busy) return null; btn.dataset.busy = 1; btn.disabled = true; }
  try{ const r = await fn(); if(opts.close !== false) $('#scrim').classList.remove('open'); if(okMsg) toast(okMsg); await reload(); return r ?? true; }
  catch(e){ toast(friendly(e)); return null; }
  finally{ if(btn){ delete btn.dataset.busy; btn.disabled = false; } }
}
const toBlob = dataUrl => fetch(dataUrl).then(r=>r.blob());

  if(can(sk,'tienda2')) Object.assign(f,{slogan:val('stSlogan'), hours:val('stHours'), policy:val('stPolicy'), theme:$('input[name=stTheme]:checked')?.value||st.theme});
  let slug=st.slug; if(can(sk,'tienda3')){ f.notice=val('stNotice'); slug=slugify(val('stSlug')||s.name); }
  if(!(await checkText([f.about,f.slogan,f.hours,f.policy,f.notice,slug.replace(/-/g,' ')].filter(Boolean).join(' \n '), 'Personalización de tienda'))) return;
  const other=skBySlug(slug); if(other && other!==sk){ toast('Esa dirección ya la usa otra tienda. Prueba con otra.'); return; }
  await act(async()=>{
    const store = Object.assign({}, st, f); delete store.slug;
    const logo = await uploadImage('tiendas', 'logo-'+Date.now(), $('#stLogo')?.files?.[0]); if(logo) store.logo = logo;
    const banner = await uploadImage('tiendas', 'portada-'+Date.now(), $('#stBanner')?.files?.[0]); if(banner) store.banner = banner;
    await api.upd('sellers', {store, slug}, {id:sk});
  }, '¡Tu tienda quedó actualizada!');
}
async function saveCoupon(e){
  e.preventDefault(); const sk=me().key, code=$('#cpCode').value.trim().toUpperCase(), type=$('#cpType').value, value=+$('#cpVal').value;
  if(!/^[A-Z0-9]{4,15}$/.test(code)){ toast('El código debe tener de 4 a 15 letras o números, sin espacios.'); return; }
  if(/\d{5,}/.test(code) || !check(code).ok){ toast('El código no puede tener datos de contacto ni más de 4 números seguidos.'); return; }
  if(S.coupons.some(c=>c.sk===sk && c.code===code)){ toast('Ya tienes un cupón con ese código.'); return; }
  if(type==='pct' && (value<1||value>70)){ toast('El porcentaje debe estar entre 1 % y 70 %.'); return; }
  await act(()=>api.ins('coupons', [{seller_id:sk, code, type, value, min_purchase:+$('#cpMin').value||0, max_uses:+$('#cpMax').value||0, until:$('#cpUntil').value||null, pub:!!$('#cpPub')?.checked}]), 'Cupón '+code+' creado.');
}

async function newTicket(e){

  await act(async()=>{ const img = await readImage(file);

const _openTicketView = id => { const t=S.tickets.find(x=>x.id===id); if(!t){ toast('No encontramos esa solicitud.'); return; } const adm=isRole('admin');
  openModal(`<div class="mpad"><h2>Solicitud #${t.id}</h2><p class="sub">${esc(t.subject)} · ${esc(t.cat)}<br>${TK_ST[t.status]} ${adm?`<span class="badge ${t.rank===0?'dark':t.rank===1?'lav':''}">${t.prio}</span> <span class="note">${esc(nameOf(t.from))} (${t.role==='seller'?'vendedor':'comprador'})</span>`:''}</p>
    <div class="thread">${t.msgs.map(m=>`<div class="tmsg ${m.from==='a'?'adm':''}"><b>${m.from==='a'?'MER-K':esc(nameOf(t.from))}</b> <span class="note">${m.t}</span><div style="white-space:pre-wrap">${esc(m.text)}</div>${m.img?`<img src="${m.img}" alt="Pantallazo adjunto">`:''}</div>`).join('')}</div>

      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn">${adm?'Enviar respuesta':'Enviar'}</button>
      ${adm&&t.status!=='cerrado'?`<button type="button" class="btn ghost" onclick="closeTicket(${t.id})">Marcar como resuelta</button>`:''}</div></form></div>`, true); };
function openTicket(id){ _openTicketView(id); const t=S.tickets.find(x=>x.id===id); if(t && (isRole('admin') ? t.unreadAdmin : t.unreadUser)) api.rpc('ticket_seen', {tid:id}).then(()=>loadAll()).catch(()=>{}); }

function myProfile(){ const p=PROFILE||{}; return {name:p.name||'', email:ME?.email||p.email||'', phone:p.phone||'', doc:p.doc||'', avatar:p.avatar||null}; }
async function saveProfile(e){ e.preventDefault(); const d=profileInput(); if(!d) return;
  if(me().role!=='admin' && !(await checkText(d.name, 'Mi perfil'))) return;
  await act(async()=>{
    if(PF_IMG){ d.avatar = await api.upload('tiendas', `${ME.id}/avatar-${Date.now()}.jpg`, await toBlob(PF_IMG)); PF_IMG=null; }
    const rows = await api.upd('profiles', d, {id:ME.id}); if(rows && rows[0]) PROFILE = rows[0];
    if(me().role==='seller') await api.upd('sellers', {owner_name:d.name}, {id:ME.id});

async function saveEmail(e){ e.preventDefault(); const em=$('#peNew').value.trim().toLowerCase();
  if(!validEmail(em)){ toast('Escribe un correo válido.'); return; }
  try{ await api.auth.setEmail(em); openModal(`<div class="mpad" style="text-align:center"><div style="font-size:46px">📩</div><h2>Confirma tu correo nuevo</h2><p class="sub">Te enviamos un enlace a <b>${esc(em)}</b>. Ábrelo desde este mismo navegador para terminar el cambio.</p><p class="note">Si también te llega un correo a tu dirección actual, ábrelo: por seguridad a veces se piden los dos. Mientras tanto sigues entrando con tu correo actual.</p><button class="btn" onclick="closeModal()">Entendido</button></div>`, true); }
  catch(x){ toast(friendly(x)); } }
async function deleteAccount(e){ e.preventDefault(); if(!deleteConfirmed()) return;
  const btn=e.submitter; if(btn) btn.disabled=true;
  try{ const r = await api.rpc('delete_my_account', {});
    if(r && r.ok===false){ toast(r.message||'No se pudo eliminar la cuenta.'); if(btn) btn.disabled=false; return; }
    try{ await api.auth.signOut(); }catch(_){}
    ME=null; PROFILE=null; S.session=null; closeModal(); location.hash='#inicio'; await reload();
    toast('Tu cuenta fue eliminada. Gracias por haber estado en MER-K.');
  }catch(err){ toast('No se pudo eliminar: '+(err.message||err)); if(btn) btn.disabled=false; }
}

  if($('#ppNew').value!==$('#ppNew2').value){ toast('Las contraseñas nuevas no coinciden.'); return; }
  try{ await api.auth.setPassword($('#ppNew').value); toast('¡Contraseña actualizada!'); render(); }catch(x){ toast(friendly(x)); } }

/* =====================================================================
   ARRANQUE
   ===================================================================== */
async function boot(){
  if(!api){ $('#app').innerHTML = '<div class="panel" style="text-align:center;padding:40px"><h2>No pudimos cargar MER-K</h2><p class="sub">Revisa tu conexión a internet y recarga la página.</p></div>'; return; }
  $('#app').innerHTML = '<div class="panel" style="text-align:center;padding:50px"><p class="sub">Cargando MER-K…</p></div>';
  let recovering = /type=recovery/.test(location.hash);
  api.auth.onChange((ev, user)=>{ if(ev==='PASSWORD_RECOVERY'){ recovering = true; newPasswordModal(); } if(ev==='SIGNED_OUT' && ME){ ME=null; PROFILE=null; S.session=null; render(); } });
  const user = await api.auth.user().catch(()=>null);
  await setUser(user);
  const authMsg = /message=/.test(location.hash) ? decodeURIComponent(location.hash.split('message=')[1]||'').replace(/\+/g,' ') : '';
  if(/access_token|type=|message=|error_description=/.test(location.hash)) history.replaceState(null, '', location.pathname + (PROFILE?.role==='seller' ? '#vender' : '#inicio'));
  if(/confirm link sent to the other email/i.test(authMsg)) openModal(`<div class="mpad" style="text-align:center"><div style="font-size:46px">✉️</div><h2>Te falta un paso</h2><p class="sub">Ya confirmaste uno de los enlaces. Por seguridad, abre también el enlace que te llegó a tu <b>otro correo</b> (el anterior o el nuevo) para terminar el cambio.</p><button class="btn" onclick="closeModal()">Entendido</button></div>`, true);
  else if(EMAIL_UPDATED) toast('✅ Tu correo quedó actualizado: '+(ME?.email||''));
  if(recovering) newPasswordModal();
  else if(!S.locAsked && !new URLSearchParams(location.search).get('id')) setTimeout(()=>askLocation(), 400);
  wompiReturn();
  let tmr=null; api.live(()=>{ clearTimeout(tmr); tmr=setTimeout(async()=>{ const before=S.notifs.filter(n=>!n.read).length; await loadAll();
    const open=$('#scrim').classList.contains('open'); if(open && chatKey && $('.chat')) drawChat(); if(!open) render(); else $('#acct').innerHTML=headerRight();
    if(S.notifs.filter(n=>!n.read).length>before) toast('🔔 Tienes una notificación nueva.'); }, 400); });
  setInterval(()=>{ if(!$('#scrim').classList.contains('open') && document.visibilityState==='visible') reload(); }, 90000);
}


$('#q').addEventListener('input', e=>{ S.ui.q=e.target.value; if((location.hash||'#inicio')!=='#inicio') location.hash='#inicio'; else render(); });
window.addEventListener('hashchange', ()=>{ if(/access_token|type=|message=|error_description=/.test(location.hash)) return; window.scrollTo(0,0); render(); });
S.ui.q=''; boot();

</script>
