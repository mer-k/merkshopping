function prodSlide(p){ return `<button class="adslide adprod" onclick="showProduct(${p.id})" aria-label="Ver ${esc(p.t)}">
    <div class="adpimg" style="${thumbStyle(p)}">${thumbInner(p)}</div>
    <div class="adptxt"><span class="adpk">⭐ Destacado · ${esc(SEL(p.s).name)}</span><b>${esc(p.t)}</b><span class="adpprice">${fromTxt(p)}${discOf(p)>0?`<s>${cop(p.p)}</s> `:''}${cop(finalPrice(p))}</span><span class="btn sm">Ver producto</span></div></button>`; }
function imgSlide(b){
  const img=`<img src="${esc(b.img)}" alt="${esc(b.name||'Publicidad')}" loading="lazy" draggable="false">`;
  if(b.sk && S.sellers[b.sk]) return `<a class="adslide" href="${storeUrl(b.sk)}" aria-label="Ver la tienda ${esc(SEL(b.sk).name)}">${img}</a>`;
  if(b.link) return `<a class="adslide" href="${esc(b.link)}" target="_blank" rel="noopener sponsored">${img}</a>`;
  return `<div class="adslide">${img}</div>`;
}
function bannerHtml(){
  const list=[...activeBanners().map(b=>imgSlide(b)), ...bannerProducts().map(p=>prodSlide(p))];
  if(!list.length) return `<section class="adban adempty" aria-label="Espacio publicitario"><div><b>Espacio publicitario</b><span>Anuncia tu marca aquí y llega a miles de compradores en MER-K</span></div><span class="adtag">Publicidad</span></section>`;
  return `<section class="adban" aria-label="Publicidad" data-n="${list.length}" data-i="0" ontouchstart="adTouch(event)" ontouchend="adTouchEnd(event)"><div class="adtrack">${list.join('')}</div>
    ${list.length>1?`<button class="adarr l" onclick="adStep(-1)" aria-label="Anterior">‹</button><button class="adarr r" onclick="adStep(1)" aria-label="Siguiente">›</button>
    <div class="addots">${list.map((_,i)=>`<button aria-label="Banner ${i+1}" class="${i?'':'on'}" onclick="adGo(${i})"></button>`).join('')}</div>`:''}<span class="adtag">Publicidad</span></section>`;
}
let AD_PAUSE=0, AD_X=null;
function adGo(i, auto){ const b=document.querySelector('.adban[data-n]'); if(!b) return; const n=+b.dataset.n; i=((i%n)+n)%n; b.dataset.i=i; if(!auto) AD_PAUSE=Date.now();
  b.querySelector('.adtrack').style.transform=`translateX(-${i*100}%)`; b.querySelectorAll('.addots button').forEach((d,k)=>d.classList.toggle('on',k===i)); }
function adStep(d){ const b=document.querySelector('.adban[data-n]'); if(b) adGo(+b.dataset.i+d); }
function adTouch(e){ AD_X=e.touches[0].clientX; }
function adTouchEnd(e){ if(AD_X===null) return; const dx=e.changedTouches[0].clientX-AD_X; AD_X=null; if(Math.abs(dx)>40) adStep(dx<0?1:-1); }
setInterval(()=>{ const b=document.querySelector('.adban[data-n]'); if(b && +b.dataset.n>1 && document.visibilityState==='visible' && Date.now()-AD_PAUSE>8000) adGo(+b.dataset.i+1, true); }, 5000);

/* Administración → Publicidad: hasta 4 banners, cada uno de una tienda y con fecha y hora */
const bnLabel = v => { const t=bnTime(v); if(!t) return ''; const d=new Date(t); return `${fdate(t)}, ${d.toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'})}`; };
const nowLocal = (addDays=0) => { const d=new Date(Date.now()+addDays*864e5); d.setSeconds(0,0); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,16); };
const bnCount = () => (S.cfg.banners||[]).filter(b=>bannerState(b)!=='vencido').length;
function storeOptions(sel){ return `<option value="">Ninguna (usar un link)</option>`+Object.entries(S.sellers).filter(([k,s])=>s.status==='activa').sort((a,b)=>a[1].name.localeCompare(b[1].name)).map(([k,s])=>`<option value="${k}" ${k===sel?'selected':''}>${esc(s.name)}</option>`).join(''); }
function bannerFields(b={}){
  return `<label>Nombre del banner<input id="bnName" required maxlength="60" placeholder="Ej: Promo de noviembre Casa Bonita" value="${esc(b.name||'')}"></label>
    <label>¿De qué tienda es? Al tocar el banner, la gente llega a su perfil<select id="bnStore">${storeOptions(b.sk)}</select></label>
    <label>Link (solo si no es de una tienda de MER-K)<input id="bnLink" inputmode="url" placeholder="Ej: instagram.com/marca" value="${esc(b.link||'')}"></label>
    <div class="row2"><label>Se muestra desde<input id="bnStart" type="datetime-local" required value="${esc(b.start||nowLocal())}"></label><label>Hasta<input id="bnEnd" type="datetime-local" required value="${esc(b.end||nowLocal(7))}"></label></div>`;
}
function readBannerFields(){
  let link=$('#bnLink').value.trim(); if(link && !/^https?:\/\//i.test(link)) link='https://'+link;
  const d={name:$('#bnName').value.trim(), sk:$('#bnStore').value||'', link, start:$('#bnStart').value, end:$('#bnEnd').value};
  if(bnTime(d.end)<=bnTime(d.start)) throw new Error('La fecha y hora final debe ser después de la inicial.');
  return d;
}
function adminAdsTab(){
  const list=S.cfg.banners||[], full=bnCount()>=MAX_BANNERS;
  return `<div class="panel"><h3>Banners del inicio (${bnCount()} de ${MAX_BANNERS})</h3><p class="note" style="margin-top:-6px">Se deslizan solos cada 5 segundos en la página de inicio, para todos los visitantes. Cada banner se muestra solo entre su fecha y hora de inicio y de fin. Al tocarlo, la gente llega al perfil de la tienda.</p>
    ${list.length?list.map((b,i)=>{ const st=bannerState(b), [l,c]=BN_ST[st]; return `<div class="adrow"><img src="${esc(b.img)}" alt=""><div><b>${esc(b.name||'Banner '+(i+1))}</b> <span class="badge ${c}">${l}</span><br><span class="note">${b.sk&&S.sellers[b.sk]?'🏪 '+esc(SEL(b.sk).name):b.link?'🔗 '+esc(b.link):'Sin enlace'}<br>${b.start?bnLabel(b.start):'Desde ya'} → ${b.end?bnLabel(b.end):'sin fecha final'}</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${i?`<button class="btn ghost sm" onclick="moveBanner(${i},-1)" title="Subir">↑</button>`:''}<button class="btn ghost sm" onclick="editBanner(${i})">Cambiar</button><button class="btn ghost sm" onclick="toggleBanner(${i})">${b.on===false?'Activar':'Pausar'}</button><button class="btn bad sm" onclick="delBanner(${i})">Quitar</button></div></div>`; }).join('')
      :'<p class="empty">Aún no hay banners. Mientras tanto, en el inicio se ve un recuadro de “Espacio publicitario”.</p>'}</div>
    <div class="panel"><h3>Agregar banner</h3>${full?`<p class="empty">Ya tienes ${MAX_BANNERS} banners. Quita uno o espera a que termine alguno para agregar otro.</p>`:`<form class="form" onsubmit="addBanner(event)">
      <label>Imagen del banner<input id="adImg" type="file" accept="image/*" required></label>
      <p class="note" style="margin:-4px 0 0">Tamaño recomendado: <b>1600 × 320 px</b> (horizontal, 5 a 1). Deja los textos importantes en el centro, porque en celular se recortan un poco los bordes.</p>
      ${bannerFields()}
      <div><button class="btn">Publicar banner</button></div></form>`}</div>
    ${adminAdRequests()}${adminPriorityPanel()}`;
}
function readFileShrunk(file, max){ return new Promise(ok=>{ if(!file) return ok(null); const rd=new FileReader(); rd.onload=()=>shrink(rd.result, ok, max); rd.readAsDataURL(file); }); }
async function storeBannerImage(dataUrl){ return dataUrl; }
async function saveBanners(list, msg){ S.cfg.banners=list; save(); toast(msg); render(); }
async function addBanner(e){
  e.preventDefault(); const btn=e.target.querySelector('button.btn');
  try{
    if(bnCount()>=MAX_BANNERS){ toast(`Máximo ${MAX_BANNERS} banners.`); return; }
    const d=readBannerFields(); if(!d.sk && !d.link && !confirm('Este banner no lleva a ninguna tienda ni link. ¿Publicarlo así?')) return;
    if(btn){ btn.disabled=true; btn.textContent='Subiendo…'; }
    const data=await readFileShrunk($('#adImg').files[0], 1600); if(!data){ toast('Elige una imagen.'); return; }
    const img=await storeBannerImage(data);
    await saveBanners([...(S.cfg.banners||[]), Object.assign({id:Date.now(), img, on:true}, d)], bannerState(d)==='programado'?'Banner programado: sale en la fecha y hora que pusiste.':'Banner publicado en el inicio.');
  }catch(x){ toast(errText(x)); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='Publicar banner'; } }
}
function editBanner(i){ const b=(S.cfg.banners||[])[i]; if(!b) return;
  openModal(`<div class="mpad"><h2>Cambiar banner</h2><img src="${esc(b.img)}" alt="" style="width:100%;aspect-ratio:5/1;object-fit:cover;border-radius:12px;margin-bottom:12px">
    <form class="form" onsubmit="saveBannerEdit(event,${i})"><label>Imagen nueva (déjalo vacío para conservar la actual)<input id="ebImg" type="file" accept="image/*"></label>
    ${bannerFields(b)}<div><button class="btn">Guardar cambios</button></div></form></div>`, true); }
async function saveBannerEdit(e, i){ e.preventDefault(); const btn=e.target.querySelector('button.btn');
  try{ const l=[...(S.cfg.banners||[])], b=Object.assign({...l[i]}, readBannerFields()); btn.disabled=true; btn.textContent='Guardando…';
    const f=$('#ebImg').files[0]; if(f){ const data=await readFileShrunk(f, 1600); b.img=await storeBannerImage(data); }
    l[i]=b; closeModal(); await saveBanners(l, 'Banner actualizado para todos.'); }
  catch(x){ toast(errText(x)); btn.disabled=false; btn.textContent='Guardar cambios'; } }
function toggleBanner(i){ const l=[...(S.cfg.banners||[])]; l[i]={...l[i], on:l[i].on===false}; saveBanners(l, l[i].on?'Banner activado.':'Banner pausado.'); }
function delBanner(i){ if(!confirm('¿Quitar este banner?')) return; const l=[...(S.cfg.banners||[])]; l.splice(i,1); saveBanners(l, 'Banner quitado.'); }
function moveBanner(i,d){ const l=[...(S.cfg.banners||[])], j=i+d; if(j<0||j>=l.length) return; [l[i],l[j]]=[l[j],l[i]]; saveBanners(l, 'Orden actualizado.'); }

/* =====================================================================
   CARRITO DE COMPRAS (se guarda en este navegador)
   ===================================================================== */
const CART_KEY='merk-cart';
function cartRaw(){ try{ const c=JSON.parse(localStorage.getItem(CART_KEY)||'[]'); return Array.isArray(c)?c.filter(i=>i&&i.pid):[]; }catch(e){ return []; } }
const cartKey = i => i.pid+'|'+JSON.stringify(i.opts||{});
function cartGet(){ return cartRaw().filter(i=>{ const p=P(i.pid); return p && !p.paused && p.stock>0; }).map(i=>({pid:i.pid, qty:Math.max(1, Math.min(+i.qty||1, P(i.pid).stock)), opts:i.opts||null})); }
function cartSet(list){ try{ localStorage.setItem(CART_KEY, JSON.stringify(list)); }catch(e){} const a=$('#acct'); if(a) a.innerHTML=headerRight(); }
function cartCount(){ return cartGet().reduce((n,i)=>n+i.qty,0); }
function cartBtn(){ const n=cartCount(); return `<button class="bell cartbtn" onclick="showCart()" aria-label="Carrito de compras">🛒${n?`<span>${n}</span>`:''}</button>`; }
function canShop(){ const s=me(); if(s && s.role!=='buyer'){ toast('Para comprar necesitas una cuenta de comprador.'); return false; } return true; }
function addToCart(pid){
  if(!canShop()) return;
  const p=P(pid); if(!p || p.stock<1){ toast('Este producto se agotó.'); return; }
  const opts=pickedOpts(p); if(opts===false) return;
  const c=cartRaw(), k=cartKey({pid, opts}), it=c.find(i=>cartKey(i)===k), inCart=c.filter(i=>i.pid===pid).reduce((n,i)=>n+(+i.qty||1),0);
  if(inCart>=p.stock){ toast(`Solo hay ${p.stock} disponibles y ya están en tu carrito.`); return; }
  if(it) it.qty++; else c.push(opts?{pid, qty:1, opts}:{pid, qty:1});
  cartSet(c); closeModal(); toast('🛒 Agregado al carrito. ¡Sigue comprando!');
}
function showCart(){
  const items=cartGet(); cartSet(items);
  if(!items.length){ openModal(`<div class="mpad" style="text-align:center"><div style="font-size:46px">🛒</div><h2>Tu carrito está vacío</h2><p class="sub">Toca “Agregar y seguir comprando” en los productos que te gusten y aquí se van sumando.</p><button class="btn" onclick="closeModal();location.hash='#inicio'">Ver productos</button></div>`, true); return; }
  const sub=items.reduce((a,i)=>a+finalPrice(P(i.pid))*i.qty,0), n=items.reduce((a,i)=>a+i.qty,0);
  openModal(`<div class="mpad"><h2>🛒 Tu carrito</h2><p class="sub">${n} producto${n>1?'s':''}</p>
    <div class="cart">${items.map((i,ix)=>{ const p=P(i.pid); return `<div class="citem"><div class="cthumb" style="${thumbStyle(p)}">${thumbInner(p)}</div>
      <div class="cinfo"><b>${esc(p.t)}</b>${i.opts?`<span class="optline">${esc(optsLabel(i.opts))}</span>`:''}<span class="note">${esc(SEL(p.s).name)} · ${cop(itemPrice(p,i.opts))} c/u</span>
        <div class="qty"><button onclick="cartQty(${ix},-1)" aria-label="Quitar uno">−</button><span>${i.qty}</span><button onclick="cartQty(${ix},1)" aria-label="Agregar uno">+</button><a class="note" href="javascript:cartRemove(${ix})">Quitar</a></div></div>
      <b class="cline">${cop(itemPrice(p,i.opts)*i.qty)}</b></div>`; }).join('')}</div>
    <table class="sum" style="margin-top:12px"><tr><td><b>Subtotal</b></td><td style="text-align:right"><b class="price">${cop(sub)}</b></td></tr></table>
    <p class="note" style="margin:4px 0 14px">El domicilio o envío y los cupones se calculan en el siguiente paso.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" style="flex:1" onclick="startCheckout(cartGet(),'cart')">Pagar</button><button class="btn ghost" onclick="closeModal()">Seguir comprando</button></div></div>`, true);
}
function cartQty(ix, d){ const c=cartGet(), it=c[ix]; if(!it) return; const p=P(it.pid), others=c.filter((x,j)=>j!==ix && x.pid===it.pid).reduce((n,x)=>n+x.qty,0); it.qty=(+it.qty||1)+d; if(p && it.qty+others>p.stock){ it.qty=Math.max(0,p.stock-others); toast(`Solo hay ${p.stock} disponibles.`); } cartSet(c.filter(i=>i.qty>0)); showCart(); }
function cartRemove(ix){ cartSet(cartGet().filter((x,j)=>j!==ix)); showCart(); }

/* =====================================================================
   PAGO EN 2 PASOS: 1) datos de entrega  2) resumen, cupón y pago
   ===================================================================== */
let CO = {items:[]};
const errText = e => typeof friendly==='function' ? friendly(e) : String(e?.message||e);
function buyNow(pid){ if(!canShop()) return; const p=P(pid), opts=pickedOpts(p); if(opts===false) return; startCheckout([opts?{pid, qty:1, opts}:{pid, qty:1}], 'now'); }
function startCheckout(items, mode){
  if(!isRole('buyer')){ loginModal(me()?'Para comprar necesitas una cuenta de comprador.':'Inicia sesión o crea tu cuenta de comprador para pagar. Tu carrito queda guardado.'); return; }
  items=(items||[]).filter(i=>P(i.pid)); if(!items.length){ toast('Tu carrito está vacío.'); return; }
  CO={items, mode, addr:null, carriers:{}, coupon:null, cpMsg:null, q:null};
  coStep1();
}
function coSteps(n){ return `<div class="costeps"><span class="${n===1?'on':'done'}" ${n===2?'onclick="coStep1()"':''}>1. Datos de entrega</span><span class="${n===2?'on':''}">2. Pago</span></div>`; }
function coStep1(){
  const b=BUY(me().key), A=b.addresses||[], a=CO.addr || A.find(x=>x.city===S.loc) || A[0] || {name:b.name, phone:b.phone, city:S.loc};
  openModal(`<div class="mpad">${coSteps(1)}<h2>¿A dónde te lo llevamos?</h2><p class="sub" style="margin-bottom:12px">Sirve para domicilios en Medellín y alrededores y para envíos a todo el país. Con estos datos programamos tu entrega.</p>
    <form class="form" onsubmit="coSubmit1(event)">
      ${A.length?`<label>Usar una dirección guardada<select id="coSaved" onchange="coPickSaved()"><option value="">Escribir una dirección nueva</option>${A.map(x=>`<option value="${x.id}" ${a.id===x.id?'selected':''}>${esc(x.alias)}: ${esc(x.dir)}, ${esc(x.city)}</option>`).join('')}</select></label>`:''}
      <div class="row2"><label>Nombre completo de quien recibe<input id="coName" required minlength="3" maxlength="60" value="${esc(a.name||'')}"></label><label>Celular<input id="coPhone" required inputmode="numeric" maxlength="10" placeholder="3001234567" value="${esc(a.phone||b.phone||'')}"></label></div>
      <div class="row2"><label>Municipio o ciudad<select id="coCity" ${otherToggle('coCity','coCityO')}>${cityOptions(a.city||S.loc)}</select><input id="coCityO" placeholder="Escribe tu municipio" style="display:none"></label><label>Barrio<input id="coBarrio" required maxlength="60" value="${esc(a.barrio||'')}"></label></div>
      <label>Dirección<input id="coDir" required minlength="5" maxlength="120" placeholder="Calle, carrera, número, apto o casa" value="${esc(a.dir||'')}"></label>
      <label>Punto de referencia<input id="coRef" maxlength="120" placeholder="Ej: frente al parque, portería torre 2, casa de rejas blancas" value="${esc(a.notes||'')}"></label>
      <p class="alert" id="coErr" style="display:none"></p>
      <button class="btn" style="width:100%">Continuar</button></form></div>`, true);
  coFixCity(a.city||S.loc);
}
function coFixCity(city){ if(city && !CITIES.includes(city)){ $('#coCity').value=OTHER; $('#coCityO').style.display='block'; $('#coCityO').value=city; } }
function coPickSaved(){
  const a=(BUY(me().key).addresses||[]).find(x=>x.id==$('#coSaved').value); if(!a) return;
  $('#coName').value=a.name||''; $('#coPhone').value=a.phone||BUY(me().key).phone||''; $('#coBarrio').value=a.barrio||''; $('#coDir').value=a.dir||''; $('#coRef').value=a.notes||'';
  $('#coCity').innerHTML=cityOptions(a.city); $('#coCityO').style.display='none'; coFixCity(a.city);
}
async function coSubmit1(e){
  e.preventDefault(); const err=t=>{ const el=$('#coErr'); el.textContent=t; el.style.display='block'; };
  const d={name:$('#coName').value.trim(), phone:$('#coPhone').value.replace(/\s/g,''), city:readCity('coCity','coCityO'), barrio:$('#coBarrio').value.trim(), dir:$('#coDir').value.trim(), notes:$('#coRef').value.trim()};
  if(!validPhone(d.phone)) return err('El celular debe tener 10 dígitos y empezar por 3.');
  if(!d.city) return err('Escribe tu municipio.');
  const btn=e.target.querySelector('button.btn'); btn.disabled=true; btn.textContent='Guardando…';
  try{ CO.addr = await coSaveAddress(d); await coStep2(); }
  catch(x){ err(errText(x)); btn.disabled=false; btn.textContent='Continuar'; }
}
/* Guarda la dirección para próximas compras (si ya existe, la actualiza) */
async function coSaveAddress(d){
  const b=BUY(me().key), A=b.addresses||(b.addresses=[]), ex=A.find(x=>deacc(x.dir.toLowerCase())===deacc(d.dir.toLowerCase()) && x.city===d.city);
  if(ex){ Object.assign(ex, d); save(); return ex; }
  const a=Object.assign({id:Date.now(), alias:A.length?'Entrega '+(A.length+1):'Principal'}, d); A.push(a); save(); return a;
}
async function coStep2(){
  openModal(`<div class="mpad">${coSteps(2)}<h2>Revisa y paga</h2><div id="coBody"><p class="sub">Calculando domicilio o envío…</p></div></div>`, true);
  if(!CO.coupon) coAutoCoupon();
  await coQuote();
}
async function coQuote(){
  try{
    CO.q = await cartQuote(CO.items, CO.addr.city, CO.carriers, CO.coupon);
    if(CO.coupon && !CO.q.coupon){ CO.cpMsg = CO.q.coupon_error || 'Ese cupón no aplica.'; CO.coupon=null; CO.q = await cartQuote(CO.items, CO.addr.city, CO.carriers, null); }
  }catch(e){ $('#coBody').innerHTML=`<p class="alert">${esc(errText(e))}</p><button class="btn ghost" onclick="showCart()">Revisar carrito</button>`; return; }
  coDraw();
}
const coStores = () => [...new Set(CO.items.map(i=>P(i.pid)?.s).filter(Boolean))];
function coAutoCoupon(){ if(!isRole('buyer')) return; const bk=me().key, st=coStores();
  const c=S.coupons.find(c=>st.includes(c.sk) && couponLive(c) && claimed(bk,c.id)); if(c) CO.coupon=c.code; }
function coCouponHints(){ const st=coStores(), bk=me().key;
  const list=S.coupons.filter(c=>st.includes(c.sk) && couponLive(c) && can(c.sk,'cupones') && (claimed(bk,c.id) || (c.pub && can(c.sk,'promos'))));
  return list.length?`Cupones disponibles: ${list.map(c=>`<a href="javascript:coUse('${esc(c.code)}')"><b>${esc(c.code)}</b></a> (${couponLabel(c)} en ${esc(SEL(c.sk).name)})`).join(' · ')}`:''; }
function coUse(code){ CO.coupon=code; CO.cpMsg=null; coQuote(); }
function coApplyCoupon(){ const v=$('#coCode').value.trim().toUpperCase(); CO.coupon=v||null; CO.cpMsg=null; coQuote(); }
function coClearCoupon(){ CO.coupon=null; CO.cpMsg=null; coQuote(); }
function coSetCarrier(sk, v){ CO.carriers[sk]=v; coQuote(); }
function coDraw(){
  const q=CO.q, a=CO.addr, prod=q.groups.reduce((s,g)=>s+g.list,0), disc=q.groups.reduce((s,g)=>s+g.coupon_amount,0), ship=q.groups.reduce((s,g)=>s+g.ship_cost,0);
  $('#coBody').innerHTML = `
    <div class="shipbox"><b>📍 Entregar a ${esc(a.name)} · ${esc(a.phone)}</b><span>${esc(a.dir)}, barrio ${esc(a.barrio)}, ${esc(a.city)}${a.notes?' · '+esc(a.notes):''}</span><a class="note" href="javascript:coStep1()">Cambiar datos de entrega</a></div>
    ${q.groups.map(g=>`<div class="cogroup"><div class="cohead">${esc(g.store)}${q.groups.length>1&&!q.hub?' <span class="note">· llega en un pedido aparte</span>':''}</div>
      ${g.lines.map(l=>`<div class="coline"><span>${esc(l.title)}${l.qty>1?` <span class="note">× ${l.qty}</span>`:''}</span><span>${cop(l.unit*l.qty)}</span></div>`).join('')}
      ${g.coupon_amount?`<div class="coline good"><span>Cupón ${esc(g.coupon)}</span><span>−${cop(g.coupon_amount)}</span></div>`:''}

/* Cotización del carrito (en la página real la calcula el servidor) */
async function cartQuote(items, city, carriers, coupon){
  const code=String(coupon||'').trim().toUpperCase(); let cpErr=code?'Ese cupón no aplica a los productos de tu compra.':null, cpUsed=null;
  const groups={}; items.forEach(i=>{ const p=P(i.pid); if(!p || p.paused || p.stock<1) throw new Error('Uno de los productos ya no está disponible. Revisa tu carrito.');
    if(p.stock<i.qty) throw new Error(`De "${p.t}" solo quedan ${p.stock} unidades.`); const op=checkOpts(p, i.opts); (groups[p.s]||(groups[p.s]=[])).push({p, qty:i.qty, opts:op}); });
  const out=Object.entries(groups).map(([sk, lines])=>{
    const list=lines.reduce((a,l)=>a+itemPrice(l.p,l.opts)*l.qty,0); let disc=0;
    if(code && !cpUsed){ const c=S.coupons.find(x=>x.sk===sk && x.code===code);
      if(c){ if(!can(sk,'cupones')) cpErr='Ese cupón no existe en esta tienda.'; else if(!couponLive(c)) cpErr='Ese cupón ya no está vigente.';
        else if(c.min && list<c.min) cpErr=`Este cupón aplica en compras desde ${cop(c.min)} en ${SEL(sk).name}.`;
        else { disc=Math.max(0, Math.min(list-1000, c.type==='pct'?Math.round(list*c.value/100):c.value)); cpUsed=code; cpErr=null; } } }
    const allFree=lines.every(l=>l.p.freeShip); let ship;
    if(inArea(city) && inArea(SEL(sk).city)){ const tarifa=zonePrice(city); ship={ship_type:'dom', tarifa, free:allFree, ship_cost:allFree?0:tarifa, carrier:null, eta:'Entrega en '+etaDom()}; }
    else { const nc=Math.max(0,...lines.filter(l=>!l.p.freeShip).map(l=>l.p.natCost||0)); ship={ship_type:'nat', tarifa:nc, free:allFree, ship_cost:allFree?0:nc, carrier:CARRIERS.includes(carriers?.[sk])?carriers[sk]:CARRIERS[0], eta:'Entrega en '+etaNat()+' según la transportadora'}; }
    return Object.assign({sk, store:SEL(sk).name, lines:lines.map(l=>({pid:l.p.id, title:l.p.t+(l.opts?' ('+optsLabel(l.opts)+')':''), qty:l.qty, unit:itemPrice(l.p,l.opts), opts:l.opts})), list, coupon:disc?code:null, coupon_amount:disc, price:list-disc}, ship, {total:list-disc+ship.ship_cost});
  });
  if(hubOn() && out.length){
    const dom=inArea(city), car=dom?null:(CARRIERS.includes(carriers?.all)?carriers.all:CARRIERS[0]), fee=dom?zonePrice(city):0, allFreeAll=dom&&out.every(g=>g.free), n=out.length;
    out.forEach((g,i)=>{ Object.assign(g, {hub:true, ship_type:dom?'dom':'nat', carrier:car, anchor:i===0, eta:'Entrega en '+(dom?etaDom():etaNat())});
      if(allFreeAll) Object.assign(g, {free:true, tarifa:Math.ceil(fee/n), ship_cost:0});
      else Object.assign(g, {free:false, tarifa:i===0?fee:0, ship_cost:i===0?fee:0});
      g.total=g.price+g.ship_cost; });
    return {groups:out, total:out.reduce((a,g)=>a+g.total,0), hub:true, ship_fee:allFreeAll?0:fee, ship_cod:!dom, coupon:cpUsed, coupon_error:cpUsed?null:cpErr, carriers:CARRIERS};
  }
  return {groups:out, total:out.reduce((a,g)=>a+g.total,0), coupon:cpUsed, coupon_error:cpUsed?null:cpErr, carriers:CARRIERS};
}

function waNumber(phone){ let d=String(phone||'').replace(/\D/g,''); if(d.length===10 && d[0]==='3') d='57'+d; return d; }
function waLink(phone, text){ return `https://wa.me/${waNumber(phone)}?text=${encodeURIComponent(text)}`; }
function openWa(phone, text, name){ if(!waNumber(phone)){ toast('Este pedido no tiene celular del comprador.'); return; } const url=waLink(phone, text); let w=null; try{ w=window.open(url, '_blank'); }catch(e){} if(w){ try{ w.opener=null; }catch(e){} return; } waAlertBar(url, name); }
function orderProducts(o){ return (o.items&&o.items.length?o.items:[{title:o.title, qty:1}]).map(l=>l.title+(l.qty>1?` (x${l.qty})`:'')).join(', '); }
function waShipMsg(o){
  const name=String(o.addr?.name||BUY(o.bk).name||'').trim().split(' ')[0], store=SEL(o.sk).name, prods=orderProducts(o), d=o.delivery||{}, pk=o.pickup||{};
  const hi=`Hola ${name} 👋 Tu pedido #${o.id} de la tienda ${store} (${prods})`;
  if(o.ship.type==='nat'){
    const car=d.carrier||o.ship.carrier||'la transportadora', guia=d.guia||'[número de guía]';
    return `${hi} ya fue despachado 📦\n\nTransportadora: ${car}\nNúmero de guía: ${guia}\n\nPuedes rastrearlo en la página de ${car}. ¡Gracias por comprar en MER-K! 💜`;
  }
  const who=String(d.who||pk.who||'nuestro mensajero').replace(/ \([^)]*\)$/,''), when=d.date?`${dLabel(d.date)}${d.time?', '+d.time.toLowerCase():''}`:(pk.deliver||'');
  return `${hi} ya fue despachado 🛵\n\nTe lo entrega ${who}, mensajero de ${courier()}${when?', el '+when:''}.\nCódigo de seguimiento: ${d.guia||'DOM-'+String(o.id).padStart(6,'0')}\nDirección: ${addrLine(o.addr)}\n\n¡Gracias por comprar en MER-K! 💜`;
}
function waPanel(o){
  if(!['agendado','despachado','entregado'].includes(o.status) && !o.delivery) return '';
  return `<div class="panel" style="margin:0 0 14px;border-color:#25D366"><h3>📲 Avisar al comprador por WhatsApp</h3>
    <p class="note" style="margin-top:-6px">Se abre el WhatsApp de MER-K con este mensaje listo para ${esc(o.addr.name||'el comprador')} (${esc(o.addr.phone||'sin celular')}). Revisa los datos y toca Enviar.</p>
    <div class="form"><textarea id="waMsg" rows="7">${esc(waShipMsg(o))}</textarea>
    <div><button type="button" class="btn wa" onclick="openWa('${esc(o.addr.phone||'')}', $('#waMsg').value)">Abrir WhatsApp y enviar</button></div></div></div>`;
}

function pqrsRead(){
  const err=t=>{ const el=$('#qErr'); el.textContent=t; el.style.display='block'; return null; };
  const d={kind:$('#qKind').value, name:$('#qName').value.trim(), email:$('#qEmail').value.trim().toLowerCase(), phone:$('#qPhone').value.trim(), order:$('#qOrder').value.trim(), msg:$('#qMsg').value.trim()};
  if(d.name.length<3) return err('Escribe tu nombre completo.');
  if(!validEmail(d.email)) return err('Escribe un correo válido.');
  if(d.msg.length<10) return err('Cuéntanos un poco más en el mensaje.');
  return d;
}
function submitPqrs(e){
  e.preventDefault(); const d=pqrsRead(); if(!d) return;
  S.pqrs=S.pqrs||[]; S.nextPqrs=S.nextPqrs||1000; const id=S.nextPqrs++;
  S.pqrs.unshift({id, kind:d.kind, name:d.name, email:d.email, phone:d.phone, order:d.order, msg:d.msg, status:'abierta', answer:'', created:now(), ts:T()});
  notify('admin', `📨 PQRS #${id} · ${d.kind}`, `${d.name}: ${d.msg.slice(0,120)}`);
  S.ui.pqrsSent=id; save(); render(); window.scrollTo(0,0);
}

function waAlertWho(key){ const s=S.sellers&&S.sellers[key]; if(s) return {phone:s.phone, name:s.owner||s.name, seller:true}; const b=S.buyers&&S.buyers[key]; return b?{phone:b.phone, name:b.name, seller:false}:{}; }
function waAlertText(name, seller){ const first=String(name||'').trim().split(/\s+/)[0]; return `Hola${first?' '+first:''} 👋 Tienes un mensaje nuevo de MER-K en la página.\n\nEntra a merkshopping.com, inicia sesión y revisa ${seller?'tu panel de vendedor (Mensajes o Soporte)':'tus mensajes o la campanita 🔔'} para leerlo y responder.\n\n¡Gracias!`; }
// Se llama justo al tocar "Enviar" (antes de esperar al servidor) para que el navegador no bloquee la ventana.
/* El aviso por WhatsApp sale solo con el primer mensaje: si ya le avisamos a esa persona
   en las últimas 12 horas, no se vuelve a abrir WhatsApp (ya sabe que tiene mensajes en la página) */
const WA_GAP = 12*3600e3;
function waSentMap(){ try{ return JSON.parse(localStorage.getItem('merk-wa-sent')||'{}'); }catch(e){ return {}; } }
function waMark(key){ const m=waSentMap(); m[key]=Date.now(); Object.keys(m).forEach(k=>{ if(Date.now()-m[k]>7*864e5) delete m[k]; }); try{ localStorage.setItem('merk-wa-sent', JSON.stringify(m)); }catch(e){} }
function waRecently(key){ const t=waSentMap()[key]; return t && Date.now()-t < WA_GAP; }
function waAlert(key, phone){
  if(S.cfg.waAlerts===false || !isRole('admin')) return;
  if(waRecently(key)) return;
  const w=waAlertWho(key), ph=phone||w.phone;
  if(!waNumber(ph)){ toast('Esta persona no tiene celular registrado, así que no se abrió WhatsApp.'); return; }
  const url=waLink(ph, waAlertText(w.name, w.seller)); let win=null; waMark(key);
  try{ win=window.open(url, '_blank'); }catch(e){}
  if(win){ try{ win.opener=null; }catch(e){} return; }
  waAlertBar(url, w.name);   // el navegador bloqueó la ventana: un toque en el botón siempre funciona
}
function waAlertBar(url, name){
  let bar=document.getElementById('waBar'); if(bar) bar.remove();
  bar=document.createElement('div'); bar.id='waBar'; bar.className='wabar';
  bar.innerHTML=`<span>✅ Mensaje enviado. Avísale a <b>${esc(String(name||'esta persona').split(' ')[0])}</b> por WhatsApp:</span><a class="btn wa" href="${esc(url)}" target="_blank" rel="noopener" onclick="setTimeout(()=>document.getElementById('waBar')?.remove(),300)">📲 Avisar por WhatsApp</a><button type="button" class="x" aria-label="Cerrar" onclick="this.parentElement.remove()">×</button>`;
  document.body.appendChild(bar); clearTimeout(waAlertBar._t); waAlertBar._t=setTimeout(()=>bar.remove(), 60000);
}
function waAlertForChat(k){ if(!k || k[0]==='p') return; const o=O(tPid(k)); if(!o) return; if(k.endsWith(':b')) waAlert(o.bk, o.addr&&o.addr.phone); else waAlert(o.sk); }

/* =================== ESPECIFICACIONES DEL PRODUCTO =================== */
const SPEC_UNITS = ['g','kg','mg','lb','oz','ml','L','oz líq.','cc','unidades'];
const SPEC_FIXED = [['spTalla','Talla','Ej: S, M, L, XL o 36, 38, 40'],['spMedidas','Tamaño o medidas','Ej: Pequeño, Mediano, Grande o 30 x 20 cm'],['spMaterial','Material','Ej: Cuero, algodón, acero inoxidable'],['spColor','Color','Ej: Negro, café, beige'],['spMarca','Marca','Ej: Hecho a mano o la marca'],['spModelo','Modelo o referencia','Ej: 2025, ref. A12']];
const SPEC_PICKABLE = ['spTalla','spMedidas','spMaterial','spColor'];
const SPEC_OLD = {'Tallas':'Talla','Medidas o tamaño':'Tamaño o medidas','Color(es)':'Color'};
const SPEC_PESO = 'Peso o contenido';
const MAX_SPECS = 20;
function specsOf(p){ return Array.isArray(p&&p.specs) ? p.specs.filter(x=>x&&x.k&&x.v).map(x=>SPEC_OLD[x.k]?Object.assign({},x,{k:SPEC_OLD[x.k]}):x) : []; }
function specRowHtml(k, v, pick){ return `<div class="specrow"><input class="spK" maxlength="30" placeholder="Ej: Sabor, Aroma, Voltaje" value="${esc(k||'')}"><input class="spV" maxlength="80" placeholder="Ej: Vainilla, Fresa, Chocolate" value="${esc(v||'')}"><button type="button" class="btn ghost sm" aria-label="Quitar" onclick="this.parentElement.remove()">✕</button><label class="pickchk"><input type="checkbox" class="spP" ${pick?'checked':''}> El cliente elige una opción</label></div>`; }
function addSpecRow(){ const box=$('#spExtra'); if(box.children.length>=10){ toast('Puedes agregar máximo 10 especificaciones extra.'); return; } box.insertAdjacentHTML('beforeend', specRowHtml()); box.lastElementChild.querySelector('input').focus(); }
function pesoRowHtml(c, price){ const m=String(c||'').match(/^([\d.,]+)\s*(.+)$/), num=m?m[1]:'', unit=m&&SPEC_UNITS.includes(m[2])?m[2]:'kg';
  return `<div class="pesorow"><input class="pzN" type="text" inputmode="decimal" maxlength="10" placeholder="Ej: 3" aria-label="Peso o contenido" value="${esc(num)}"><select class="pzU" aria-label="Unidad">${SPEC_UNITS.map(u=>`<option ${u===unit?'selected':''}>${u}</option>`).join('')}</select><input class="pzP" type="number" min="1000" step="100" placeholder="Precio (Ej: 50000)" aria-label="Precio de este peso" value="${esc(price)}"><button type="button" class="btn ghost sm" aria-label="Quitar" onclick="pesoRemove(this)">✕</button></div>`; }
function addPesoRow(){ const box=$('#pesoRows'); if(box.children.length>=10){ toast('Máximo 10 pesos o tamaños.'); return; } box.insertAdjacentHTML('beforeend', pesoRowHtml('', '')); box.lastElementChild.querySelector('input').focus(); pesoSync(); }
function pesoRemove(btn){ const box=$('#pesoRows'); if(box.children.length>1) btn.parentElement.remove(); else btn.parentElement.querySelectorAll('input').forEach(i=>i.value=''); pesoSync(); }
function pesoRead(){ return [...document.querySelectorAll('#pesoRows .pesorow')].map(r=>({c:(r.querySelector('.pzN').value.trim().replace(/[,;/]/g,'.')?r.querySelector('.pzN').value.trim().replace(/[,;/]/g,'.')+' '+r.querySelector('.pzU').value:''), price:Math.round(+r.querySelector('.pzP').value||0)})).filter(r=>r.c); }
/* Con varios pesos, el precio principal es el del más barato y no se escribe a mano */
function pesoSync(){ const rows=pesoRead(), fp=$('#fp'); if(!fp) return; const ps=rows.length>=2 ? rows.map(r=>r.price).filter(x=>x>0) : [];
  if(rows.length>=2){ if(ps.length) fp.value=Math.min(...ps); fp.readOnly=true; fp.title='Con varios pesos, este es el precio del más barato'; } else { fp.readOnly=false; fp.title=''; } }
function specsFields(p){
  const list=specsOf(p), get=k=>{ const x=list.find(s=>s.k===k); return x?x.v:''; };
  const pesoSpec=list.find(s=>s.k===SPEC_PESO), pesoRows=pesoSpec ? specChoices(pesoSpec.v).map((c,ix)=>({c, price:(pesoSpec.prices||[])[ix]||''})) : [{c:'',price:''}];
  const fixedKeys=[SPEC_PESO, ...SPEC_FIXED.map(f=>f[1])], extra=list.filter(s=>!fixedKeys.includes(s.k));
  const isNew=!p, pk=(id,l)=>{ const x=list.find(s=>s.k===l); return x ? !!x.pick : (isNew && (id==='spTalla'||id==='spColor')); };
  const fld=([id,l,ph])=>`<label>${l}<input id="${id}" maxlength="80" placeholder="${ph}" value="${esc(get(l))}">${SPEC_PICKABLE.includes(id)?`<span class="pickchk"><input type="checkbox" id="${id}P" ${pk(id,l)?'checked':''}> El cliente elige una opción</span>`:''}</label>`;
  return `<fieldset><legend>Especificaciones del producto (opcional)</legend>
    <p class="note" style="margin:0">Llena solo las que apliquen a tu producto. Si marcas <b>“El cliente elige una opción”</b>, separa las opciones con comas (Ej: S, M, L) y el comprador escoge una antes de pagar.</p>
    <div class="pesobox"><b style="font-size:14px">${SPEC_PESO}</b>
      <p class="note" style="margin:2px 0 6px">Si vendes el mismo producto en varios pesos o tamaños (Ej: 1 kg, 3 kg y 8 kg), agrega uno por fila con <b>su precio</b>. El cliente escoge y ve el precio de cada uno.</p>
      <div id="pesoRows" class="pesorows" oninput="pesoSync()" onchange="pesoSync()">${pesoRows.map(r=>pesoRowHtml(r.c, r.price)).join('')}</div>
      <button type="button" class="btn ghost sm" onclick="addPesoRow()">+ Agregar otro peso con su precio</button></div>
    <div class="row2">${fld(SPEC_FIXED[0])}${fld(SPEC_FIXED[3])}</div>
    <div class="row2">${fld(SPEC_FIXED[1])}${fld(SPEC_FIXED[2])}</div>
    <div class="row2">${[SPEC_FIXED[4],SPEC_FIXED[5]].map(fld).join('')}</div>
    <div><b style="font-size:14px">Otras especificaciones</b><div id="spExtra" class="specextra">${extra.map(s=>specRowHtml(s.k,s.v,s.pick)).join('')}</div>
    <button type="button" class="btn ghost sm" onclick="addSpecRow()">+ Agregar otra especificación</button></div></fieldset>`;
}
function readSpecs(){
  const out=[], push=(k,v,pick)=>{ k=String(k||'').trim().slice(0,30); v=String(v||'').trim().slice(0,80); if(k&&v&&out.length<MAX_SPECS&&!out.some(x=>x.k.toLowerCase()===k.toLowerCase())) out.push(pick&&specChoices(v).length>=2?{k,v,pick:true}:{k,v}); };
  const pz=pesoRead();
  if(pz.length===1) push(SPEC_PESO, pz[0].c);
  else if(pz.length>1){ if(pz.some(r=>!(r.price>=1000))) throw new Error('Pon el precio de cada peso o tamaño (mínimo $1.000).'); if(new Set(pz.map(r=>r.c.toLowerCase())).size<pz.length) throw new Error('Hay pesos repetidos. Revisa la lista.'); out.push({k:SPEC_PESO, v:pz.map(r=>r.c).join(', '), pick:true, prices:pz.map(r=>r.price)}); }
  SPEC_FIXED.forEach(([id,l])=>push(l, $('#'+id)?.value, $('#'+id+'P')?.checked));
  document.querySelectorAll('#spExtra .specrow').forEach(r=>push(r.querySelector('.spK').value, r.querySelector('.spV').value, r.querySelector('.spP').checked));
  return out;
}
const specsText = list => list.map(s=>s.k+' '+s.v).join(' \n ');
function specsTable(p){ const l=specsOf(p).filter(s=>!pickSpecs(p).some(x=>x.k===s.k)); if(!l.length) return ''; return `<div class="specs"><b>Especificaciones</b><table>${l.map(s=>`<tr><th>${esc(s.k)}</th><td>${esc(s.v)}</td></tr>`).join('')}</table></div>`; }

/* ---------- El comprador elige (talla, color, tamaño…) ---------- */
const joinY = a => a.length>1 ? a.slice(0,-1).join(', ')+' y '+a[a.length-1] : (a[0]||'');
const specChoices = v => String(v||'').split(/[,;/]/).map(x=>x.trim()).filter(Boolean);
const pickSpecs = p => specsOf(p).filter(s=>s.pick && specChoices(s.v).length>=2);
let PICK = {pid:null, opts:{}};
function pickerHtml(p){
  const l=pickSpecs(p); PICK={pid:p.id, opts:{}}; if(!l.length) return '';
  return `<div class="picker">${l.map((s,si)=>`<div class="pickgrp" data-k="${esc(s.k)}"><b>${esc(s.k)}: <span class="pickval" id="pv${si}">elige una</span></b>
    <div class="pickopts">${specChoices(s.v).map((c,ci)=>`<button type="button" class="pickopt" aria-pressed="false" onclick="pickOpt(${si},${ci},this)">${esc(c)}${Array.isArray(s.prices)&&s.prices[ci]?`<small>${cop(Math.round(s.prices[ci]*(1-discOf(p)/100)))}</small>`:''}</button>`).join('')}</div></div>`).join('')}</div>`;
}
function pickOpt(si, ci, btn){
  const p=P(PICK.pid), s=pickSpecs(p)[si], c=specChoices(s.v)[ci]; PICK.opts[s.k]=c;
  btn.parentElement.querySelectorAll('.pickopt').forEach(b=>{ b.classList.toggle('on', b===btn); b.setAttribute('aria-pressed', b===btn); });
  const v=$('#pv'+si); if(v) v.textContent=c; btn.closest('.pickgrp').classList.remove('miss'); pickPriceUpdate();

/* Devuelve las opciones elegidas (en el orden del vendedor), null si el producto no tiene, o false si falta alguna */
function pickedOpts(p){
  const l=pickSpecs(p); if(!l.length) return null;
  if(PICK.pid!==p.id || !$('.picker')){ showProduct(p.id); toast('Elige '+joinY(l.map(s=>s.k.toLowerCase()))+' antes de comprar.'); return false; }
  const miss=l.filter(s=>!PICK.opts[s.k]);
  if(miss.length){ document.querySelectorAll('.pickgrp').forEach(g=>g.classList.toggle('miss', miss.some(s=>s.k===g.dataset.k))); toast('Elige '+joinY(miss.map(s=>s.k.toLowerCase()))+' antes de comprar.'); return false; }
  const o={}; l.forEach(s=>o[s.k]=PICK.opts[s.k]); return o;
}
function checkOpts(p, opts){ const l=pickSpecs(p); if(!l.length) return null; const o={};
  l.forEach(s=>{ const c=specChoices(s.v).find(x=>x.toLowerCase()===String((opts||{})[s.k]||'').trim().toLowerCase()); if(!c) throw new Error(`Elige ${s.k.toLowerCase()} de "${p.t}" antes de comprar.`); o[s.k]=c; }); return o; }
const optsLabel = o => Object.entries(o||{}).map(([k,v])=>k+': '+v).join(', ');

/* ---------- Precio según el peso o tamaño elegido ---------- */
const priceSpec = p => specsOf(p).find(s=>s.pick && Array.isArray(s.prices) && s.prices.length===specChoices(s.v).length && specChoices(s.v).length>=2);
const hasVarPrices = p => !!priceSpec(p);
function basePrice(p, opts){ const s=priceSpec(p); if(!s||!opts||!opts[s.k]) return p.p; const ix=specChoices(s.v).findIndex(c=>c.toLowerCase()===String(opts[s.k]).toLowerCase()); return ix>=0 && s.prices[ix]>0 ? s.prices[ix] : p.p; }
const itemPrice = (p, opts) => Math.round(basePrice(p, opts) * (1 - discOf(p)/100));
const fromTxt = p => hasVarPrices(p) ? '<span class="desde">Desde </span>' : '';
function pickPriceUpdate(){ const p=P(PICK.pid); if(!p || !hasVarPrices(p)) return; const el=$('#mPrice'), old=$('#mOld'); const b=basePrice(p, PICK.opts), chosen=PICK.opts[priceSpec(p).k];
  if(el) el.innerHTML=(chosen?'':fromTxt(p))+cop(Math.round(b*(1-discOf(p)/100))); if(old) old.textContent=cop(b); }

/* =================== SANCIONES (Administración) =================== */
const fmtUntil = t => { try{ return new Date(t).toLocaleString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric',hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } };
function acctOf(k){ return S.sellers[k] || S.buyers[k]; }
function modUser(k){
  const u=acctOf(k); if(!u) return; const isS=!!S.sellers[k], name=isS?(u.name+(u.owner?' · '+u.owner:'')):u.name;

        <div class="specw"><select id="mdDays" aria-label="Tiempo">${[[1,'1 día'],[3,'3 días'],[7,'7 días'],[15,'15 días'],[30,'30 días'],[90,'3 meses']].map(([d,l])=>`<option value="${d}" ${d===7?'selected':''}>${l}</option>`).join('')}</select><button class="btn sm" style="background:#e9a23b" onclick="doModerate('${k}','castigar')">Castigar</button></div></div>
      <div class="modbox"><b>⛔ Bloquear para siempre</b><p class="note">No puede volver a usar la cuenta hasta que tú la desbloquees.</p><button class="btn bad sm" onclick="doModerate('${k}','bloquear')">Bloquear</button></div>
      ${u.status!=='activa'||u.warnings?`<div class="modbox"><b>✅ Desbloquear / quitar castigo</b><p class="note">La cuenta vuelve a estar activa y se borran sus advertencias.</p><button class="btn sm" onclick="doModerate('${k}','desbloquear')">Desbloquear</button></div>`:''}
    </div>
    ${modExtra(k)}
    <div class="dangerbox" style="margin-top:14px"><b>🗑️ Eliminar la cuenta para siempre</b><p class="note" style="margin:4px 0 8px">Se borran sus datos${isS?', su tienda y sus productos':''}. Esto no se puede deshacer. Si tiene pedidos en curso${isS?' o dinero por transferirle':''}, primero hay que terminarlos; mientras tanto, bloquéala.</p>
      <div class="specw"><input id="mdDel" placeholder="Escribe ELIMINAR para confirmar" autocomplete="off"><button class="btn bad sm" onclick="doDeleteUser('${k}')">Eliminar</button></div></div></div>`);
}
function modMsg(action, days){ return action==='advertir'?'Advertencia enviada.':action==='castigar'?`Cuenta castigada por ${days} día(s).`:action==='bloquear'?'Cuenta bloqueada.':'Cuenta desbloqueada. Ya puede usar MER-K.'; }
function doModerate(k, action){
  const u=acctOf(k), days=+$('#mdDays').value, why=$('#mdWhy').value.trim();
  if(action==='advertir'){ if(!confirm(`¿Enviarle una advertencia a ${u.name}?`)) return; u.warnings=Math.min(3,(u.warnings||0)+1); notify(k,'⚠️ Recibiste una advertencia de MER-K',(why?'Motivo: '+why+'. ':'')+'Recuerda seguir las reglas de la comunidad.'); save(); closeModal(); toast('Advertencia enviada.'); render(); return; }
  if(action!=='desbloquear' && !confirm(action==='castigar'?`¿Castigar a ${u.name} por ${days} día(s)?`:`¿Bloquear a ${u.name} para siempre?`)) return;
  if(action==='castigar'){ u.status='suspendida'; u.until=Date.now()+days*864e5; }
  else if(action==='bloquear'){ u.status='bloqueada'; u.until=null; }
  else { u.status='activa'; u.until=null; u.warnings=0; }
  notify(k, action==='castigar'?'⏸️ Tu cuenta fue suspendida':action==='bloquear'?'⛔ Tu cuenta fue bloqueada':'✅ Tu cuenta está activa de nuevo', (why?'Motivo: '+why+'. ':'')+modMsg(action,days));
  save(); closeModal(); toast(modMsg(action, days)); render();
}
function doDeleteUser(k){
  if($('#mdDel').value.trim().toUpperCase()!=='ELIMINAR'){ toast('Escribe ELIMINAR para confirmar.'); return; }
  const busy=S.orders.some(o=>(o.bk===k||o.sk===k) && !['finalizado','devuelto','cancelado'].includes(o.st));
  if(busy){ toast('Esta cuenta tiene pedidos en curso. Bloquéala mientras terminan.'); return; }
  if(S.sellers[k]){ S.products=S.products.filter(p=>p.s!==k); delete S.sellers[k]; } else delete S.buyers[k];
  save(); closeModal(); toast('Cuenta eliminada para siempre.'); render();
}
function suspExpired(u){ return u && u.status==='suspendida' && u.until && u.until<Date.now(); }
function accountBanner(){
  if(!me() || isRole('admin')) return ''; const u=acctOf(me().key); if(!u) return '';

  return '';
}

/* Código de barras Code 128 (juego B) como SVG */
function barcodeSvg(text, h){
  const s=String(text).replace(/[^\x20-\x7E]/g,''); const vals=[104, ...[...s].map(c=>c.charCodeAt(0)-32)];
  vals.push(vals.reduce((a,v,i)=>a+v*(i||1),0)%103); vals.push(106);
  let x=10, bars=''; vals.forEach(v=>{ [...C128[v]].forEach((wd,i)=>{ const w=+wd; if(i%2===0) bars+=`<rect x="${x}" y="0" width="${w}" height="${h}"/>`; x+=w; }); });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x+10} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block" shape-rendering="crispEdges">${bars}</svg>`;
}

function acctOfMe(){ const s=me(); if(!s || s.role==='admin') return null; return s.role==='seller' ? SEL(s.key) : BUY(s.key); }

function readVerify(){

function verifList(){ const rows=[];
  Object.entries(S.sellers).forEach(([k,a])=>{ if(k!==OFFICIAL) rows.push({k, role:'seller', a}); });
  Object.entries(S.buyers).forEach(([k,a])=>{ if(a.role!=='admin' && (a.verify==='revision'||a.verify==='rechazado')) rows.push({k, role:'buyer', a}); });
  const ord={revision:0, rechazado:1, sin_enviar:2, aprobado:3};
  return rows.sort((x,y)=>(ord[x.a.verify||'sin_enviar']-ord[y.a.verify||'sin_enviar']) || String(x.a.name).localeCompare(y.a.name)); }
const verifPending = () => verifList().filter(r=>r.a.verify==='revision').length;

}

  <li>Si eres comerciante, recuerda la garantía legal y, en ventas a distancia, el derecho de retracto de 5 días hábiles (Ley 1480 de 2011).</li></ul>
  <h3>Garantías, cambios y devoluciones</h3>
  <p>Las da cada tienda según sus términos y condiciones (los ves en su tienda). Cuando la tienda es comerciante, responde por la garantía legal según el Estatuto del Consumidor.</p>
  <h3>Retracto de los planes de MER-K</h3>

/* ---------- WhatsApp de la tienda y redes sociales ---------- */
const cleanHandle = v => String(v||'').trim().replace(/^https?:\/\/(www\.)?(instagram|tiktok)\.com\/@?/i,'').replace(/^@/,'').replace(/[/?#].*$/,'').replace(/[^A-Za-z0-9._-]/g,'').slice(0,40);
const cleanUrl = v => { v=String(v||'').trim(); if(!v) return ''; if(!/^https?:\/\//i.test(v)) v='https://'+v; try{ const u=new URL(v); return /^https?:$/.test(u.protocol) ? u.href.slice(0,200) : ''; }catch(e){ return ''; } };
function socialOf(sk){ const st=(SEL(sk)||{}).store||{}; return Object.assign({ig:'', fb:'', tt:'', web:''}, st.social||{}); }
function socialLinks(sk, withWa){
  const so=socialOf(sk), L=[];
  if(withWa) L.push(`<button class="soc wa" onclick="contactWaSeller('${sk}')" title="WhatsApp">🟢 WhatsApp</button>`);
  if(so.ig) L.push(`<a class="soc" href="https://instagram.com/${encodeURIComponent(so.ig)}" target="_blank" rel="noopener nofollow">📷 Instagram</a>`);
  if(so.fb) L.push(`<a class="soc" href="${esc(so.fb)}" target="_blank" rel="noopener nofollow">👍 Facebook</a>`);
  if(so.tt) L.push(`<a class="soc" href="https://www.tiktok.com/@${encodeURIComponent(so.tt)}" target="_blank" rel="noopener nofollow">🎵 TikTok</a>`);
  if(so.web) L.push(`<a class="soc" href="${esc(so.web)}" target="_blank" rel="noopener nofollow">🌐 Página web</a>`);
  return L.length ? `<div class="socs">${L.join('')}</div>` : '';
}
function socialPanel(sk){ const s=SEL(sk), so=socialOf(sk), wa = s.waStore || s.phone || '';
  return `<form class="panel form" onsubmit="saveSocial(event)"><h3>📱 WhatsApp, redes y punto físico</h3>
    <p class="note" style="margin-top:-6px">Así los compradores te encuentran. El WhatsApp se lo mostramos a los compradores que tienen cuenta en MER-K; las redes las ve cualquiera en tu tienda.</p>
    <div class="row2"><label>WhatsApp de la tienda<input id="soWa" inputmode="numeric" placeholder="3XX XXX XXXX" value="${esc(wa)}"></label><label>Instagram<input id="soIg" placeholder="@mitienda" value="${esc(so.ig?'@'+so.ig:'')}"></label></div>
    <div class="row2"><label>Facebook (enlace de tu página)<input id="soFb" placeholder="facebook.com/mitienda" value="${esc(so.fb)}"></label><label>TikTok<input id="soTt" placeholder="@mitienda" value="${esc(so.tt?'@'+so.tt:'')}"></label></div>
    <label>Página web<input id="soWeb" placeholder="www.mitienda.com" value="${esc(so.web)}"></label>
    ${physFields('so', physOf(sk))}
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn">Guardar</button><button type="button" class="btn ghost sm" onclick="testWa()">Probar mi WhatsApp</button></div></form>`; }
function readSocial(){
  const wa=$('#soWa').value.replace(/\D/g,'').replace(/^57(?=3\d{9}$)/,'');
  if(wa && !validPhone(wa)) throw 'El WhatsApp debe tener 10 números y empezar por 3.';
  const fb=cleanUrl($('#soFb').value), web=cleanUrl($('#soWeb').value);
  if($('#soFb').value.trim() && !/facebook\.com|fb\.com/i.test(fb)) throw 'El enlace de Facebook debe ser de facebook.com.';
  if($('#soWeb').value.trim() && !web) throw 'Escribe bien la dirección de tu página web.';
  return {wa, social:{ig:cleanHandle($('#soIg').value), fb, tt:cleanHandle($('#soTt').value), web}, physical:readPhys('so')};
}
function saveSocial(e){ e.preventDefault(); let d; try{ d=readSocial(); }catch(x){ return toast(x); }
  const s=SEL(me().key); s.waStore=d.wa; s.store=Object.assign({}, s.store||{}, {social:d.social, physical:d.physical||undefined}); save(); toast('¡Guardado! Ya se ven en tu tienda.'); render(); }
function testWa(){ const wa=$('#soWa').value.replace(/\D/g,''); if(!validPhone(wa.replace(/^57/,''))) return toast('Escribe primero tu WhatsApp (10 números).'); openWa(wa.replace(/^57/,''), 'Prueba de MER-K: así te va a llegar el mensaje de un comprador 👋', 'tu WhatsApp'); }
async function contactWaSeller(sk){ if(!isOfficial(sk) && !contactOk('wa')) return; const s=SEL(sk); let phone=s.waStore||s.phone, name=s.name;
  if(LIVE){ try{ const r=await api.rpc('seller_contact', {sid:sk}); phone=r.phone; name=r.name; }catch(x){ return toast(friendly(x)); } }
  if(!phone) return toast('Esta tienda no tiene WhatsApp. Escríbele por el chat de MER-K.');
  openWa(phone, `Hola 👋 Vi tu tienda *${s.name}* en MER-K y quiero hacerte una pregunta.\nhttps://merkshopping.com/${storeUrl(sk)}`, name); }

function physOf(sk){ const p=((SEL(sk)||{}).store||{}).physical; return p&&p.addr ? p : null; }
function physFields(px, p){ const on=!!(p&&p.addr);
  return `<fieldset><legend>Punto físico (opcional)</legend>
    <label class="check"><input type="checkbox" id="${px}PhOn" ${on?'checked':''} onchange="$('#${px}PhBox').style.display=this.checked?'':'none'"> <span>Tengo un local o punto físico donde los clientes pueden ir</span></label>
    <div id="${px}PhBox" style="${on?'':'display:none'}"><div class="row2"><label>Dirección del local<input id="${px}PhAddr" maxlength="120" placeholder="Ej: Cra. 43A # 1-50, local 120, C.C. Oviedo" value="${esc(p?.addr||'')}"></label><label>Ciudad o municipio<input id="${px}PhCity" maxlength="40" value="${esc(p?.city||'')}"></label></div>
    <label>Horario de atención<input id="${px}PhHours" maxlength="80" placeholder="Ej: Lunes a sábado, 9 a. m. a 7 p. m." value="${esc(p?.hours||'')}"></label></div>

function readPhys(px){ const on=$('#'+px+'PhOn'); if(!on||!on.checked) return null;

function physBox(sk){ const p=physOf(sk); if(!p) return '';

/* ---------- Cortesía: regalar meses de plan (sin cobro) ---------- */
function courtesyForm(k){ const s=SEL(k), cur=PAID.includes(s.plan)?s.plan:'pro';
  openModal(`<div class="mpad"><h2>🎁 Dar cortesía</h2><p class="sub">${esc(s.name)} · Regálale meses de plan sin cobrarle. No cuenta como ingreso.</p>
    <form class="form" onsubmit="event.preventDefault();doCourtesy('${k}')">
    <div class="row2"><label>Plan<select id="ctPlan">${PAID.map(p=>`<option value="${p}" ${p===cur?'selected':''}>${PLAN_INFO[p].name}</option>`).join('')}</select></label>
    <label>¿Cuántos meses?<select id="ctMonths">${[1,2,3,4,5,6,9,12].map(m=>`<option value="${m}" ${m===3?'selected':''}>${m} ${m===1?'mes':'meses'}</option>`).join('')}</select></label></div>
    <label>Nota (opcional, solo la ves tú)<input id="ctNote" maxlength="80" placeholder="Ej: cortesía para Laura por lanzamiento"></label>
    <p class="note" style="margin:0">El plan queda activo desde hoy (o desde que vence el actual, si es el mismo plan) por los meses que elijas. Se muestran sus productos y le llega la notificación y el correo.</p>
    <button class="btn">Dar cortesía</button></form></div>`, true); }
function doCourtesy(k){ const s=SEL(k), plan=$('#ctPlan').value, months=+$('#ctMonths').value, note=$('#ctNote').value.trim();
  const same = s.plan===plan && s.sub && !s.sub.suspended; s.plan=plan;
  const from = same ? Math.max(s.sub.due, T()) : T();
  s.sub = {due: from + months*30*DAY, suspended:false, r5:false, r0:false};
  S.products.filter(p=>p.s===k && p.pausedByPlan).forEach(p=>{ p.paused=false; p.pausedByPlan=false; });
  S.subPays.unshift({sk:k, plan, amount:0, date:now(), ts:T(), ref:'Cortesía'+(note?' · '+note:''), how:'cortesia'});
  notify(k, '🎁 ¡MER-K te regaló tu plan!', `Tienes el plan ${PLAN_INFO[plan].name} gratis por ${months} ${months===1?'mes':'meses'}, activo hasta el ${fdate(s.sub.due)}. ¡Éxitos con tus ventas!`);
  save(); closeModal(); toast(`Cortesía dada: ${PLAN_INFO[plan].name} por ${months} ${months===1?'mes':'meses'}.`); render(); }

function mktOn(){ return !!(acctOfMe()||{}).mkt; }
function setMkt(v){ const a=acctOfMe(); if(a){ a.mkt=v; save(); } toast(v?'Listo: te enviaremos promociones y novedades.':'Listo: ya no te enviaremos promociones.'); render(); }
function mktPanel(){ const on=mktOn();

function promoCount(aud){ const L=[...Object.values(S.buyers).filter(b=>b.role!=='admin').map(b=>({r:'buyer',a:b})), ...Object.entries(S.sellers).filter(([k])=>k!==OFFICIAL).map(([k,a])=>({r:'seller',a}))];
  return L.filter(x=>x.a.mkt && (aud==='todos' || (aud==='compradores'&&x.r==='buyer') || (aud==='vendedores'&&x.r==='seller'))).length; }
function readPromo(){ const subject=$('#pmSubj').value.trim(), body=$('#pmBody').value.trim();
  if(!subject || !body) throw 'Escribe el asunto y el mensaje.';
  let url=$('#pmUrl').value.trim(); if(url && !/^https?:\/\//i.test(url)) url='https://'+url;
  return {subject, title:$('#pmTitle').value.trim(), body, btn:$('#pmBtn').value.trim()||'Ver en MER-K', url:url||'https://merkshopping.com', audience:$('#pmAud').value}; }
async function sendPromo(e){ e.preventDefault(); let d; try{ d=readPromo(); }catch(x){ return toast(x); }
  const n=promoCount(d.audience); if(!n) return toast('Nadie de ese grupo ha aceptado recibir promociones todavía.');
  if(!confirm(`¿Enviar "${d.subject}" a ${n} persona${n>1?'s':''}?`)) return;

function addToCart(pid){
  if(!canShop()) return;
  const p=P(pid); if(!p || p.stock<1){ toast('Este producto se agotó.'); return; }
  const opts=pickedOpts(p); if(opts===false) return;
  const c=cartRaw(), other=c.find(i=>P(i.pid) && P(i.pid).s!==p.s);
  if(other){ ONE_PEND={pid, opts}; openModal(`<div class="mpad" style="text-align:center"><div style="font-size:42px">🛍️</div><h2>Una tienda a la vez</h2>
      <p class="sub">Puedes comprar varios productos, pero de una sola tienda a la vez. Termina este pedido y luego podrás comprar en otra tienda.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn" onclick="showCart()">Ir a pagar</button><button class="btn ghost" onclick="cartSwap()">Vaciar carrito y agregar este</button></div></div>`, true); return; }
  const k=cartKey({pid, opts}), it=c.find(i=>cartKey(i)===k), inCart=c.filter(i=>i.pid===pid).reduce((n,i)=>n+(+i.qty||1),0);
  if(inCart>=p.stock){ toast(`Solo hay ${p.stock} disponibles y ya están en tu carrito.`); return; }
  if(it) it.qty++; else c.push(opts?{pid, qty:1, opts}:{pid, qty:1});
  cartSet(c); closeModal(); toast('🛒 Agregado al carrito. ¡Sigue comprando en esta tienda!');
}
function cartSwap(){ if(!ONE_PEND) return closeModal(); const {pid,opts}=ONE_PEND; ONE_PEND=null; cartSet([opts?{pid, qty:1, opts}:{pid, qty:1}]); closeModal(); toast('🛒 Listo, tu carrito ahora tiene este producto.'); }

function coAmounts(items, ship, mode){ let sub=0, pers=0, listo=0;

    const a=coAmounts(CO2.items, ratesOf(CO2.sk)[muni]||0, mode), id=(S.nextPed=(S.nextPed||100)+1);

async function sendProof(e, id){ e.preventDefault(); const f=$('#proofFile').files[0]; if(!f) return toast('Sube la foto del comprobante.');
  const data=await readProof(f); if(!data) return toast('No pudimos leer esa imagen. Intenta con otra.');
  if(LIVE){ try{ const path=await api.uploadPriv('comprobantes', `${ME.id}/pedido-${id}-${Date.now()}.jpg`, await toBlob(data)); await api.rpc('subir_comprobante', {oid:id, path}); await reload(); }catch(x){ return toast(friendly(x)); } }
  else { const x=PD(id); if(!x.reserved){ x.items.forEach(i=>{ const p=P(i.pid), tk=p?Math.min(p.stock, i.qty):0; if(p) p.stock-=tk; i.taken=tk; if(tk<i.qty) x.sinStock=true; }); x.reserved=true; }
    x.proof=data; x.status='por_confirmar'; notify(x.sk, '💳 Tienes un pago por confirmar', `Pedido #${id}: el cliente pagó ${cop(x.now)} a tu llave Bre-B. Revisa tu banco y confírmalo.`); save(); }

async function pedEstado(id, st, info){

function makeSupaApi(){
  sbClient = window.supabase.createClient(SB_URL, SB_KEY);
  const sb = sbClient, un = r => { if(r.error) throw r.error; return r.data; };
  const filt = (x, eq) => { for(const [k,v] of Object.entries(eq||{})) x = x.eq(k, v); return x; };
  return {
    sel: async (t, o={}) => { let x = filt(sb.from(t).select(o.cols||'*'), o.eq); if(o.order) x = x.order(o.order, {ascending:!!o.asc}); if(o.limit) x = x.limit(o.limit); return un(await x); },
    ins: async (t, rows) => un(await sb.from(t).insert(rows).select()),
    upd: async (t, patch, eq) => un(await filt(sb.from(t).update(patch), eq).select()),
    del: async (t, eq) => un(await filt(sb.from(t).delete(), eq)),
    rpc: async (fn, args) => un(await sb.rpc(fn, args||{})),
    fn: async (name, body) => { const r = await sb.functions.invoke(name, {body});
      if(r.error){ let m = r.error.message; try{ const j = await r.error.context.json(); m = j.error || m; }catch(e){} throw new Error(m); } return r.data; },
    uploadPriv: async (bucket, path, blob) => { un(await sb.storage.from(bucket).upload(path, blob, {upsert:true, contentType:blob.type||'image/jpeg'})); return path; },
    signed: async (bucket, path) => { const r = await sb.storage.from(bucket).createSignedUrl(path, 900); return r.data?.signedUrl || ''; },
    upload: async (bucket, path, blob) => { un(await sb.storage.from(bucket).upload(path, blob, {upsert:true, contentType:blob.type||'image/jpeg'})); return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl + '?v=' + Date.now(); },
    auth: {
      user: async () => (await sb.auth.getSession()).data.session?.user || null,
      signIn: async (email, password) => { const r = await sb.auth.signInWithPassword({email, password}); if(r.error) throw r.error; return r.data.user; },
      signUp: async (email, password, data) => { const r = await sb.auth.signUp({email, password, options:{data, emailRedirectTo: location.origin + location.pathname}}); if(r.error) throw r.error; return r.data; },
      signOut: async () => { await sb.auth.signOut(); },
      reset: async email => { const r = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname}); if(r.error) throw r.error; },
      setPassword: async password => { const r = await sb.auth.updateUser({password}); if(r.error) throw r.error; },
      setEmail: async email => { const r = await sb.auth.updateUser({email}, {emailRedirectTo: location.origin + location.pathname}); if(r.error) throw r.error; },
      onChange: cb => sb.auth.onAuthStateChange((ev, session) => cb(ev, session?.user || null))
    },
    live: cb => { try{ sb.channel('merk-live').on('postgres_changes', {event:'INSERT', schema:'public', table:'notifications'}, cb)
        .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, cb).subscribe(); }catch(e){} }
  };

  addrs.forEach(a=>{ const b=S.buyers[a.buyer_id]; if(b) b.addresses.push(mapAddr(a)); });

function friendly(e){
  let m = String(e?.message || e || 'Algo salió mal.');
  if(/Invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos.';
  if(/Email not confirmed/i.test(m)) return 'Primero confirma tu correo: te enviamos un enlace a tu bandeja de entrada.';
  if(/already registered|already been registered/i.test(m)) return 'Ya existe una cuenta con ese correo.';
  if(/rate limit/i.test(m)) return 'Hiciste muchos intentos seguidos. Espera unos minutos.';
  if(/Failed to fetch|NetworkError/i.test(m)) return 'No hay conexión. Revisa tu internet e inténtalo de nuevo.';
  m = m.replace(/^CONTACTO:\s*/, 'No se guardó: ').replace(/^(LIMITE|PROHIBIDO|VERIFICA|PLAN|REGISTRO):\s*/, '');
  if(/row-level security|permission denied/i.test(m)) return 'No tienes permiso para hacer esto.';
  return m;
}
async function act(fn, okMsg, opts={}){
  const btn = document.activeElement?.tagName==='BUTTON' ? document.activeElement : null;
  if(btn){ if(btn.dataset.busy) return null; btn.dataset.busy = 1; btn.disabled = true; }
  try{ const r = await fn(); if(opts.close !== false) $('#scrim').classList.remove('open'); if(okMsg) toast(okMsg); await reload(); return r ?? true; }
  catch(e){ toast(friendly(e)); return null; }
  finally{ if(btn){ delete btn.dataset.busy; btn.disabled = false; } }
}

  ME = user; PROFILE = null; S.session = null;

    const rows = await api.sel('profiles', {eq:{id:user.id}}).catch(()=>[]);

}

async function wompiReturn(){
  let pend=null; try{ pend = JSON.parse(localStorage.getItem('merk-paying')||'null'); }catch(e){}
  const q = new URLSearchParams(location.search); if(!pend || !(q.get('pago') || q.get('ref_payco') || q.get('id'))) return;
  localStorage.removeItem('merk-paying'); history.replaceState(null, '', location.pathname + (pend.kind==='plan' ? '#vender' : '#compras'));
  openModal(`<div class="mpad" style="text-align:center"><div style="font-size:46px">⏳</div><h2>Confirmando tu pago…</h2><p class="sub">La pasarela de pagos nos está avisando. Esto toma unos segundos.</p></div>`, true);
  for(let i=0;i<12;i++){
    await new Promise(r=>setTimeout(r, 2500));
    const rows = await api.sel('payments', {eq:{ref:pend.ref}}).catch(()=>[]), st = rows[0]?.status;
    if(st==='APPROVED'){ try{ const bought=JSON.parse(localStorage.getItem('merk-cart-paying')||'[]'); if(bought.length) cartSet(cartRaw().filter(i=>!bought.includes(cartKey(i)) && !bought.includes(i.pid))); localStorage.removeItem('merk-cart-paying'); }catch(e){}
      await reload(); openModal(`<div class="mpad" style="text-align:center"><div style="font-size:46px">🎉</div><h2>¡Pago aprobado!</h2><p class="sub">${pend.kind==='plan'?'Tu plan ya está activo.':'Tu pedido quedó registrado. Te avisamos con la campanita cada vez que cambie.'}</p><button class="btn" onclick="closeModal()">Listo</button></div>`, true); return; }
    if(st && st!=='PENDING'){ await reload(); openModal(`<div class="mpad" style="text-align:center"><div style="font-size:46px">😕</div><h2>El pago no fue aprobado</h2><p class="sub">Respuesta: ${esc(st==='DECLINED'?'rechazado':st==='VOIDED'?'cancelado':st==='ERROR'?'falló':st)}. No se te cobró nada. Puedes intentarlo de nuevo.</p><button class="btn" onclick="closeModal()">Entendido</button></div>`, true); return; }
  }
  await reload(); openModal(`<div class="mpad" style="text-align:center"><div style="font-size:46px">🕐</div><h2>Tu pago está en proceso</h2><p class="sub">Algunos pagos (como PSE o efectivo) tardan un poco. Te avisamos con la campanita apenas se confirme.</p><button class="btn" onclick="closeModal()">Entendido</button></div>`, true);
}

async function saveProduct(e, id){
  e.preventDefault();
  const sk=me().key, s=SEL(sk), lim=planLimit(effPlan(sk));
  if(s.status!=='activa'){ toast('Tu cuenta está '+s.status+'. No puedes publicar.'); return; }
  if(!id && S.products.filter(p=>p.s===sk && !p.pausedByPlan).length>=lim){ toast(`Llegaste al límite de ${lim} productos de tu plan. Mejora tu plan para publicar más.`); return; }
  let specs; try{ specs=readSpecs(); }catch(x){ toast(x.message); return; }
  { const ps=specs.find(x=>Array.isArray(x.prices)); if(ps) $('#fp').value=Math.min(...ps.prices); }
  const t=$('#ft').value.trim(), d=$('#fd').value.trim(), sx=specsText(specs), ban=bannedReason(t+' '+d+' '+sx);
  if(ban){ bannedAlert(ban); return; }

  if(!row.lead_time){ toast('Escribe el tiempo de entrega del producto.'); return; }
  const photos=[...PF_PHOTOS];
  const upPhotos = async()=>{ const out=[]; let n=0; for(const f of photos){ if(f.url){ out.push(f.url); continue; }
      const u = await api.upload('productos', `${ME.id}/p${Date.now()}-${n++}.jpg`, await toBlob(f.prev)); if(u) out.push(u); } return out; };
  if(id){ row.paused = $('#fpause').value==='1'; await act(async()=>{ row.images = await upPhotos(); await api.upd('products', row, {id}); }, 'Cambios guardados.'); return; }
  await act(async()=>{ row.images = await upPhotos();
    await api.ins('products', [Object.assign(row, {seller_id:ME.id})]); S.ui.sellTab='productos'; }, '¡Producto publicado!');
}

async function boot(){
  if(!api){ $('#app').innerHTML = '<div class="panel" style="text-align:center;padding:40px"><h2>No pudimos cargar MER-K</h2><p class="sub">Revisa tu conexión a internet y recarga la página.</p></div>'; return; }
  $('#app').innerHTML = '<div class="panel" style="text-align:center;padding:50px"><p class="sub">Cargando MER-K…</p></div>';
  let recovering = /type=recovery/.test(location.hash);
  api.auth.onChange((ev, user)=>{ if(ev==='PASSWORD_RECOVERY'){ recovering = true; newPasswordModal(); } if(ev==='SIGNED_OUT' && ME){ ME=null; PROFILE=null; S.session=null; render(); } });
  const user = await api.auth.user().catch(()=>null);
  await setUser(user);
  const authMsg = /message=/.test(location.hash) ? decodeURIComponent(location.hash.split('message=')[1]||'').replace(/\+/g,' ') : '';
  if(/access_token|type=|message=|error_description=/.test(location.hash)) history.replaceState(null, '', location.pathname + (PROFILE?.role==='seller' ? '#vender' : '#inicio'));
  if(/confirm link sent to the other email/i.test(authMsg)) openModal(`<div class="mpad" style="text-align:center"><div style="font-size:46px">✉️</div><h2>Te falta un paso</h2><p class="sub">Ya confirmaste uno de los enlaces. Por seguridad, abre también el enlace que te llegó a tu <b>otro correo</b> (el anterior o el nuevo) para terminar el cambio.</p><button class="btn" onclick="closeModal()">Entendido</button></div>`, true);
  else if(EMAIL_UPDATED) toast('✅ Tu correo quedó actualizado: '+(ME?.email||''));
  const baja = new URLSearchParams(location.search).get('baja');
  if(baja){ history.replaceState(null,'',location.pathname+'#inicio'); unsubscribeFromLink(baja); }
  else if(recovering) newPasswordModal();
  else if(!S.locAsked && !new URLSearchParams(location.search).get('id')) setTimeout(()=>askLocation(), 400);
  wompiReturn();
  let tmr=null; api.live(()=>{ clearTimeout(tmr); tmr=setTimeout(async()=>{ const before=S.notifs.filter(n=>!n.read).length; await loadAll();
    const open=$('#scrim').classList.contains('open'); if(open && chatKey && $('.chat')) drawChat(); if(!open) softRender(); else $('#acct').innerHTML=headerRight();
    if(S.notifs.filter(n=>!n.read).length>before) toast('🔔 Tienes una notificación nueva.'); }, 400); });
  setInterval(async()=>{ if(!$('#scrim').classList.contains('open') && document.visibilityState==='visible'){ await loadAll(); softRender(); } }, 90000);
}
